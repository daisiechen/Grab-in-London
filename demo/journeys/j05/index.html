<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fancy · J05 · PM r01</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9e8df;color:#123f35;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #e96943;outline-offset:3px}.layout{max-width:1040px;padding:42px 30px;margin:auto;display:grid;grid-template-columns:1fr 390px;gap:64px;align-items:start}.review{padding:20px 0;font-size:14px;line-height:1.8}.review h1{font-size:30px;line-height:1.3;letter-spacing:-.04em}.review a{color:#123f35;text-underline-offset:4px}.review p{color:#53675b}.review .note{border-left:2px solid #a6ba8a;padding-left:14px;font-size:12px}.review label{font-size:12px;display:block;margin-top:13px}.review select,.review input{width:100%;padding:8px;background:#f5f2e8;border:1px solid #adb8a2;border-radius:5px}.tool{border:1px solid #a8b49f;background:none;border-radius:5px;color:#123f35;padding:7px 10px;margin:5px 3px 5px 0;font-size:12px}.phone{background:#f5f2e8;border:1px solid #c7cdbf;border-radius:32px;overflow:hidden;min-height:790px;box-shadow:0 16px 40px #123f3510}.statusbar{display:flex;justify-content:space-between;padding:17px 25px;font-size:12px;font-weight:650}.screen{padding:12px 23px 34px;min-height:720px}.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:19px}.brand{font-size:30px;font-weight:800;letter-spacing:-.08em}h2{font-size:29px;letter-spacing:-.035em;line-height:1.15;margin:14px 0}h3{font-size:19px;line-height:1.3;margin:12px 0}p{font-size:14px;line-height:1.6;color:#566b5c}.tiny{font-size:11px;line-height:1.55;color:#5c7062}.label{display:block;font-size:12px;font-weight:600;margin:14px 0 7px}input:not([type=checkbox]),select,textarea{width:100%;padding:11px;border:1px solid #a9b79f;border-radius:8px;background:#fcfbf7;color:#123f35;min-height:44px}textarea{resize:vertical;min-height:92px}.primary,.secondary{width:100%;border:1px solid #123f35;border-radius:10px;padding:13px 12px;min-height:48px;margin-top:12px;font-size:13px;font-weight:650}.primary{background:#123f35;color:#f5f2e8}.secondary{background:none;color:#123f35;border-color:#aab99f}.link{border:0;background:none;color:#355c47;text-decoration:underline;text-underline-offset:3px;font-size:12px;padding:7px 3px;min-height:34px}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.chip{border:1px solid #9fb18d;background:transparent;border-radius:22px;padding:8px 11px;font-size:11px;color:#355b46;margin:4px 3px 4px 0}.chip.active{background:#d7ee79;border-color:#8fab5f}.card{padding:15px;background:#fcfbf5;border:1px solid #d0d8c5;border-radius:12px;margin:12px 0}.card h3{margin:0 0 8px}.card p{font-size:12px;margin:6px 0}.badge{display:inline-block;border-radius:20px;padding:5px 9px;background:#dfe8d0;font-size:10px;font-weight:650}.error{color:#a23c26;font-size:12px;min-height:18px;margin-top:9px}.ok{color:#315d3a;font-size:12px}.divider{border:0;border-top:1px solid #d1d9c5;margin:18px 0}.check{display:flex;gap:9px;align-items:flex-start;font-size:12px;line-height:1.5;margin:12px 0}.check input{margin-top:3px}.map{height:140px;border-radius:12px;background:linear-gradient(20deg,transparent 45%,#f5f2e8 45%,#f5f2e8 52%,transparent 52%),linear-gradient(100deg,#e3e8d9 40%,#f5f2e8 40%,#f5f2e8 45%,#dae3cd 45%);position:relative;border:1px solid #c5d0b9}.pin{position:absolute;padding:7px 10px;border-radius:18px;background:#123f35;color:#f5f2e8;font-size:11px;border:0}.bar{height:5px;width:110px;background:#123f35;border-radius:8px;margin:8px auto 9px}.success{width:54px;height:54px;border-radius:50%;background:#d7ee79;display:grid;place-items:center;font-size:25px;margin:30px 0 20px}.facts{font-size:12px;padding-left:20px;line-height:1.8;color:#516c57}.spaced{margin-top:34px}.review-status{border-top:1px solid #bfc9b5;padding-top:12px;font-size:11px;overflow-wrap:anywhere}@media(max-width:750px){.layout{grid-template-columns:1fr;padding:18px 14px;gap:20px}.review{padding:0;max-width:390px;margin:auto}.review h1{font-size:26px}.phone{width:min(390px,100%);margin:auto}.review .intro{font-size:13px}}
</style></head><body><main class="layout"><aside class="review" lang="zh-CN"><p class="tiny">FANCY · J05 · IOS-0.1.0 · PM-r01</p><h1>维护自己的介绍与隐私选择。</h1><p class="intro">公开资料、可选统计、AI偏好和退出各归其位；保存/冲突/删除会产生可体验的结果。</p><a href="../../../docs/product/journeys/j05/requirements.zh-CN.md">阅读对应PRD ↗</a><p class="note">可交互iOS产品表达；身份、模型、业务数据及外部结果全部合成。直接打开无需服务、网络或持久化。不是原生App、真实认证/AI/删除，未进入UX/RD/QA。</p><details><summary>评审控制（不属于用户产品）</summary><label for="fault">下一次合成故障</label><select id="fault"><option value="">无</option><option value="profile">资料保存失败</option><option value="profile-conflict">资料版本冲突</option><option value="stats">统计选择保存失败</option><option value="prefs">偏好保存失败</option><option value="prefs-conflict">另一设备更新偏好</option><option value="delete-prefs">偏好删除失败</option></select><button class="tool" id="new-conversation">New conversation</button><button class="tool" id="idle">闲置30分钟</button><button class="tool" id="reset">重置本旅程</button></details><p class="review-status" id="review-status" aria-live="polite"></p></aside><section class="phone" aria-label="iOS journey preview"><div class="statusbar" aria-hidden="true"><span>9:41</span><span>••• ▰</span></div><div id="app"></div><div class="bar" aria-hidden="true"></div></section></main><script>
(()=>{
function initial(){return {screen:'profile',user:'alex',profile:{name:'Alex',bio:'New to London, curious about food, books and the stories around a table.',status:'new',language:'en',interest:'Books',job:'',school:'',hometown:''},draft:null,profileVersion:1,stats:false,statsDraft:false,prefs:{area:'Soho',budget:35,size:4,diet:'Any',language:'en',mood:'EASY_CONVERSATION'},prefsDraft:null,prefVersion:1,expectedVersion:1,prefConfirmed:true,editorDraft:'My unsent meal introduction stays here.',aiHard:{budget:35},aiSessionVersion:1,now:0,lastActivity:0,aiUnsent:'Could you help me find dinner?',error:'',notice:'',fail:null,clearBudget:false};}
function step(state,e){const s=JSON.parse(JSON.stringify(state));s.error='';s.notice='';switch(e.type){
case 'EDIT':s.draft={...s.profile};s.screen='edit';break;
case 'PROFILE_FIELD':s.draft[e.key]=e.value;break;
case 'SAVE_PROFILE':if(s.draft.name.trim().length<2||s.draft.name.trim().length>40||s.draft.bio.trim().length<20||s.draft.bio.trim().length>1000||!s.draft.status||!s.draft.language||!s.draft.interest){s.error='Check the required fields. Your edits are still here.';break;}if(s.fail==='profile'){s.fail=null;s.error='Your changes weren’t saved. Try again.';break;}if(s.fail==='profile-conflict'){s.fail=null;s.profileVersion++;s.profile.bio='I enjoy meeting neighbours over food, music and conversation.';s.error='Your profile changed on another device. Review the latest version before saving.';s.screen='profile-conflict';break;}s.profile={...s.draft,name:s.draft.name.trim(),bio:s.draft.bio.trim()};s.profileVersion++;s.screen='profile';s.notice='Your public introduction is updated.';break;
case 'REVIEW_PROFILE':s.screen='edit';s.notice='Latest version loaded. Your proposed edits are kept for you to review.';break;
case 'CANCEL':s.draft=null;s.prefsDraft=null;s.screen='profile';break;
case 'SETTINGS':s.screen='settings';s.statsDraft=s.stats;break;
case 'STATS':s.statsDraft=e.value;break;
case 'SAVE_STATS':if(s.fail==='stats'){s.fail=null;s.error='This choice hasn’t been saved. Try again.';break;}s.stats=s.statsDraft;s.notice='Your optional analytics choice is saved.';break;
case 'PREFS':s.screen='prefs';s.prefsDraft={...s.prefs};s.expectedVersion=s.prefVersion;break;
case 'PREF_FIELD':s.prefsDraft[e.key]=e.value;break;
case 'SAVE_PREFS':if(!Number.isFinite(Number(s.prefsDraft.budget))||Number(s.prefsDraft.budget)<0||!(Number(s.prefsDraft.size)===0||(Number.isInteger(Number(s.prefsDraft.size))&&Number(s.prefsDraft.size)>=2&&Number(s.prefsDraft.size)<=6))||!['Any','VEGETARIAN_OPTIONS','VEGAN'].includes(s.prefsDraft.diet)||!['Any','EASY_CONVERSATION','FOOD_DISCOVERIES','TRAVEL_CULTURE'].includes(s.prefsDraft.mood)){s.error='Review the preference values. Nothing was saved.';break;}if(s.fail==='prefs'){s.fail=null;s.error='Preferences weren’t saved. You can keep searching manually.';break;}if(s.fail==='prefs-conflict'){s.fail=null;s.prefVersion++;s.prefs.budget=45;s.screen='prefs-conflict';s.error='Preferences changed on another device. Latest saved values are shown; review before confirming.';break;}if(s.expectedVersion!==s.prefVersion){s.screen='prefs-conflict';s.error='Please review the latest saved version.';break;}s.prefs={...s.prefsDraft,budget:Number(s.prefsDraft.budget)||0,size:Number(s.prefsDraft.size)||0};s.prefVersion++;s.prefConfirmed=true;s.notice='Preferences saved after your confirmation. They only affect result order.';s.aiSessionVersion++;break;
case 'REVIEW_PREFS':s.expectedVersion=s.prefVersion;s.screen='prefs';s.notice='Latest saved values loaded alongside your proposed edits. Confirm only what you want.';break;
case 'DELETE_PREFS_CONFIRM':s.screen='delete-prefs';break;
case 'DELETE_PREFS':if(s.fail==='delete-prefs'){s.fail=null;s.error='Preferences couldn’t be removed. Try again.';break;}s.prefs={area:'Any',budget:0,size:0,diet:'Any',language:'Any',mood:'Any'};s.prefVersion++;s.prefConfirmed=false;s.aiHard={};s.aiSessionVersion++;s.screen='settings';s.notice='Preferences removed. Active assistant context no longer uses the old values.';break;
case 'CLEAR_BUDGET':delete s.aiHard.budget;s.clearBudget=true;s.notice='Any budget for this conversation. The saved budget will not be restored as a filter or ranking hint here.';break;
case 'QUERY_BUDGET':s.notice=s.clearBudget?'This conversation still has any budget.':'Saved budget is only a sorting preference, never an unconfirmed hard filter.';break;
case 'NEW_CONVERSATION':s.aiHard={};s.aiUnsent='';s.aiSessionVersion++;s.clearBudget=false;s.notice='New conversation. Saved account preferences and the original meal draft remain.';break;
case 'ADVANCE':s.now+=1800;s.aiHard={};s.aiSessionVersion++;s.notice='Conversation expired. Saved preferences and unsent words are kept.';break;
case 'SIGNOUT_CONFIRM':s.screen='signout';break;
case 'SIGNOUT':s.user=null;s.draft=null;s.prefsDraft=null;s.aiUnsent='';s.aiHard={};s.screen='signedout';break;
case 'FAULT':s.fail=e.value;break;
}return s;}

let s=initial();const app=document.getElementById('app');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const b=(l,t,c='primary')=>`<button class="${c}" data-e="${t}">${l}</button>`;const field=(id,l,v,area=false)=>`<label class="label" for="${id}">${l}</label>${area?`<textarea id="${id}">${esc(v)}</textarea>`:`<input id="${id}" value="${esc(v)}">`}`;
const pick=(id,title,values,value)=>`<label class="label" for="${id}">${title}</label><select id="${id}">${values.map(([v,l])=>`<option value="${v}" ${String(v)===String(value)?'selected':''}>${l}</option>`).join('')}</select>`;
function go(e){s=step(s,e);render();}
function render(){let h='';if(s.screen==='profile')h=`<span class="badge">Your public introduction</span><h2>${esc(s.profile.name)}</h2><p>${esc(s.profile.bio)}</p><p>${esc(({en:'English',es:'Spanish',zh:'Chinese',fr:'French'})[s.profile.language]||s.profile.language)} · ${esc(s.profile.interest)}</p>${[s.profile.job,s.profile.school,s.profile.hometown].filter(Boolean).length?`<p>${[s.profile.job,s.profile.school,s.profile.hometown].filter(Boolean).map(esc).join(' · ')}</p>`:''}<p class="tiny">Optional background is shown only when you choose to add it. Email and assistant preferences are private.</p>${b('Edit introduction','EDIT')}${b('Privacy and settings','SETTINGS','secondary')}`;
if(s.screen==='edit')h=`${b('Cancel edits','CANCEL','link')}<h2>In your own words.</h2><form id="profile-form">${field('name','Name · 2–40 characters',s.draft.name)}${field('bio','Introduction · 20–1000 characters',s.draft.bio,true)}${pick('status','In London',[['resident','Living here'],['new','New in town'],['visiting','Visiting']],s.draft.status)}${pick('language','Conversation language',[['en','English'],['es','Spanish'],['zh','Chinese'],['fr','French']],s.draft.language)}${pick('interest','Interest',[['Books','Books'],['Food','Food'],['Travel','Travel']],s.draft.interest)}${field('job','Occupation · optional',s.draft.job)}${field('school','School · optional',s.draft.school)}${field('hometown','Hometown · optional',s.draft.hometown)}<button class="primary">Save introduction</button></form>`;
if(s.screen==='profile-conflict')h=`<h2>Changed elsewhere.</h2><p>Your profile was updated elsewhere. Your proposed text has been kept.</p><p>Latest: ${esc(s.profile.bio)}</p><p>Your proposal: ${esc(s.draft.bio)}</p>${b('Review latest and my edits','REVIEW_PROFILE')}${b('Cancel','CANCEL','secondary')}`;
if(s.screen==='settings')h=`${b('Back to profile','CANCEL','link')}<h2>Your choices.</h2><p>Your public introduction is visible to other people. Email, private feedback and AI preferences are not public.</p><label class="check"><input id="stats" type="checkbox" ${s.statsDraft?'checked':''}>Allow optional product analytics</label>${b('Save analytics choice','SAVE_STATS')}${b('My preferences','PREFS','secondary')}${b('Sign out','SIGNOUT_CONFIRM','link')}<hr class="divider"><p class="tiny">Meal feedback and the optional product survey are separate. Account deletion has its own confirmation flow.</p>`;
if(s.screen==='prefs')h=`<h2>My preferences.</h2><p>These are saved only when you confirm. They help order results; they do not silently filter out meals.</p><p class="tiny">Latest saved budget: ${s.prefs.budget?'£'+s.prefs.budget:'Any'}</p><form id="prefs-form">${pick('area','Area',[['Any','Any area'],['Soho','Soho'],['Camden','Camden']],s.prefsDraft.area)}${pick('budget','Budget preference',[[0,'Any budget'],[25,'Up to £25'],[35,'Up to £35'],[45,'Up to £45'],[50,'Up to £50']],s.prefsDraft.budget)}${pick('size','Table size',[[0,'Any size'],[2,'2 people'],[3,'3 people'],[4,'4 people'],[5,'5 people'],[6,'6 people']],s.prefsDraft.size)}${pick('diet','Dietary options',[['Any','No preference'],['VEGETARIAN_OPTIONS','Vegetarian options'],['VEGAN','Vegan']],s.prefsDraft.diet)}${pick('pref-language','Conversation language',[['Any','Any'],['en','English'],['es','Spanish'],['zh','Chinese'],['fr','French']],s.prefsDraft.language)}${pick('mood','Atmosphere',[['Any','Any'],['EASY_CONVERSATION','Easy conversation'],['FOOD_DISCOVERIES','Food discoveries'],['TRAVEL_CULTURE','Travel & culture']],s.prefsDraft.mood)}<button class="primary">Confirm and save preferences</button></form>${b('Delete saved preferences','DELETE_PREFS_CONFIRM','secondary')}${b('Cancel','CANCEL','link')}<hr class="divider">${b('Use any budget for this conversation','CLEAR_BUDGET','secondary')}${b('Ask again with these conditions','QUERY_BUDGET','link')}`;
if(s.screen==='prefs-conflict')h=`<h2>Review your preferences.</h2><p>Latest saved budget: £${s.prefs.budget}. Your proposed budget: £${esc(s.prefsDraft.budget)}.</p><p>Nothing was overwritten. Check the changes before confirming again.</p>${b('Review and confirm','REVIEW_PREFS')}${b('Cancel','CANCEL','secondary')}`;
if(s.screen==='delete-prefs')h=`<h2>Remove saved preferences?</h2><p>Future searches and active assistant context will stop using the old values. Your meal introductions and submitted applications stay unchanged.</p>${b('Delete preferences','DELETE_PREFS')}${b('Keep preferences','PREFS','secondary')}`;
if(s.screen==='signout')h=`<h2>Sign out?</h2><p>This device will stop showing your private account content. Saved account preferences are not deleted.</p>${b('Sign out','SIGNOUT')}${b('Stay signed in','SETTINGS','secondary')}`;
if(s.screen==='signedout')h=`<h2>Fancy a bite?</h2><p>You’re browsing as a visitor. Private account content is no longer shown.</p>`;
app.innerHTML=`<section class="screen"><div class="nav"><span class="brand">fancy</span></div>${h}<p class="error" role="alert">${esc(s.error)}</p><p class="ok" role="status">${esc(s.notice)}</p></section>`;
app.querySelectorAll('[data-e]').forEach(el=>el.onclick=()=>go({type:el.dataset.e}));const bind=(id,type,key,checked=false)=>{const el=document.getElementById(id);el?.addEventListener(checked?'change':'input',()=>s=step(s,{type,key,value:checked?el.checked:el.value}));};
if(s.screen==='edit')for(const key of ['name','bio','status','language','interest','job','school','hometown'])bind(key,'PROFILE_FIELD',key);
if(s.screen==='prefs')for(const key of ['area','budget','size','diet','pref-language','mood'])bind(key,'PREF_FIELD',key==='pref-language'?'language':key);
bind('stats','STATS',null,true);document.getElementById('profile-form')?.addEventListener('submit',e=>{e.preventDefault();go({type:'SAVE_PROFILE'});});document.getElementById('prefs-form')?.addEventListener('submit',e=>{e.preventDefault();go({type:'SAVE_PREFS'});});
document.getElementById('review-status').textContent=`合成账号 ${s.user||'访客'} · 资料版本 ${s.profileVersion} · 偏好版本 ${s.prefVersion} · 原编辑器：${s.editorDraft} · 当前条件 ${JSON.stringify(s.aiHard)} · CLEAR ${s.clearBudget}`;
}
document.getElementById('reset').onclick=()=>{s=initial();render();};document.getElementById('fault').onchange=e=>go({type:'FAULT',value:e.target.value});document.getElementById('new-conversation').onclick=()=>go({type:'NEW_CONVERSATION'});document.getElementById('idle').onclick=()=>go({type:'ADVANCE'});render();

})();
</script></body></html>
