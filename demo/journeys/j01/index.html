*{box-sizing:border-box}body{margin:0;background:#e9e8df;color:#123f35;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #e96943;outline-offset:3px}.layout{max-width:1040px;padding:42px 30px;margin:auto;display:grid;grid-template-columns:1fr 390px;gap:64px;align-items:start}.review{padding:20px 0;font-size:14px;line-height:1.8}.review h1{font-size:30px;line-height:1.3;letter-spacing:-.04em}.review a{color:#123f35;text-underline-offset:4px}.review p{color:#53675b}.review .note{border-left:2px solid #a6ba8a;padding-left:14px;font-size:12px}.review label{font-size:12px;display:block;margin-top:13px}.review select,.review input{width:100%;padding:8px;background:#f5f2e8;border:1px solid #adb8a2;border-radius:5px}.tool{border:1px solid #a8b49f;background:none;border-radius:5px;color:#123f35;padding:7px 10px;margin:5px 3px 5px 0;font-size:12px}.phone{background:#f5f2e8;border:1px solid #c7cdbf;border-radius:32px;overflow:hidden;min-height:790px;box-shadow:0 16px 40px #123f3510}.statusbar{display:flex;justify-content:space-between;padding:17px 25px;font-size:12px;font-weight:650}.screen{padding:12px 23px 34px;min-height:720px}.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:19px}.brand{font-size:30px;font-weight:800;letter-spacing:-.08em}h2{font-size:29px;letter-spacing:-.035em;line-height:1.15;margin:14px 0}h3{font-size:19px;line-height:1.3;margin:12px 0}p{font-size:14px;line-height:1.6;color:#566b5c}.tiny{font-size:11px;line-height:1.55;color:#5c7062}.label{display:block;font-size:12px;font-weight:600;margin:14px 0 7px}input:not([type=checkbox]),select,textarea{width:100%;padding:11px;border:1px solid #a9b79f;border-radius:8px;background:#fcfbf7;color:#123f35;min-height:44px}textarea{resize:vertical;min-height:92px}.primary,.secondary{width:100%;border:1px solid #123f35;border-radius:10px;padding:13px 12px;min-height:48px;margin-top:12px;font-size:13px;font-weight:650}.primary{background:#123f35;color:#f5f2e8}.secondary{background:none;color:#123f35;border-color:#aab99f}.link{border:0;background:none;color:#355c47;text-decoration:underline;text-underline-offset:3px;font-size:12px;padding:7px 3px;min-height:34px}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.chip{border:1px solid #9fb18d;background:transparent;border-radius:22px;padding:8px 11px;font-size:11px;color:#355b46;margin:4px 3px 4px 0}.chip.active{background:#d7ee79;border-color:#8fab5f}.card{padding:15px;background:#fcfbf5;border:1px solid #d0d8c5;border-radius:12px;margin:12px 0}.card h3{margin:0 0 8px}.card p{font-size:12px;margin:6px 0}.badge{display:inline-block;border-radius:20px;padding:5px 9px;background:#dfe8d0;font-size:10px;font-weight:650}.error{color:#a23c26;font-size:12px;min-height:18px;margin-top:9px}.ok{color:#315d3a;font-size:12px}.divider{border:0;border-top:1px solid #d1d9c5;margin:18px 0}.check{display:flex;gap:9px;align-items:flex-start;font-size:12px;line-height:1.5;margin:12px 0}.check input{margin-top:3px}.map{height:140px;border-radius:12px;background:linear-gradient(20deg,transparent 45%,#f5f2e8 45%,#f5f2e8 52%,transparent 52%),linear-gradient(100deg,#e3e8d9 40%,#f5f2e8 40%,#f5f2e8 45%,#dae3cd 45%);position:relative;border:1px solid #c5d0b9}.pin{position:absolute;padding:7px 10px;border-radius:18px;background:#123f35;color:#f5f2e8;font-size:11px;border:0}.bar{height:5px;width:110px;background:#123f35;border-radius:8px;margin:8px auto 9px}.success{width:54px;height:54px;border-radius:50%;background:#d7ee79;display:grid;place-items:center;font-size:25px;margin:30px 0 20px}.facts{font-size:12px;padding-left:20px;line-height:1.8;color:#516c57}.spaced{margin-top:34px}.review-status{border-top:1px solid #bfc9b5;padding-top:12px;font-size:11px;overflow-wrap:anywhere}@media(max-width:750px){.layout{grid-template-columns:1fr;padding:18px 14px;gap:20px}.review{padding:0;max-width:390px;margin:auto}.review h1{font-size:26px}.phone{width:min(390px,100%);margin:auto}.review .intro{font-size:13px}}
</style></head><body><main class="layout"><aside class="review" lang="zh-CN"><p class="tiny">FANCY · J01 · IOS-0.1.0 · PM-r01</p><h1>找到合适的一顿饭，发出自己的申请。</h1><p class="intro">从访客浏览、筛选和详情进入完整身份与资料流程，再主动申请到待审/撤回。AI可选，不替用户提交。</p><a id="review-prd" href="../../../docs/product/journeys/j01/requirements.zh-CN.md">阅读对应PRD ↗</a><p class="note">可交互iOS产品表达；身份、模型、业务数据及外部结果全部合成。直接打开无需服务、网络或持久化。不是原生App、真实认证/AI/删除，未进入UX/RD/QA。</p><details><summary>评审控制（不属于用户产品）</summary><p>合成邮箱仅@example.test。验证码从123456开始，重发后变化；画面外状态行显示当前码。正式产品不暴露验证码。</p><label><input type="checkbox" id="existing">已有账号且资料完整</label><label><input type="checkbox" id="full">当前饭局变满员</label><label><input type="checkbox" id="closed">当前饭局已截止</label><label for="fault">下一次合成故障</label><select id="fault"><option value="">无</option><option value="auth">认证失败</option><option value="profile">资料保存失败</option><option value="submit">申请失败（未写入）</option><option value="unknown">申请响应丢失（已受理）</option><option value="ai">AI不可用</option><option value="ai-cost">AI费用硬闸</option></select><button class="tool" id="advance30">推进30秒</button><button class="tool" id="advance300">推进5分钟</button><button class="tool" id="advance1800">推进30分钟</button><button class="tool" id="reset">重置本旅程</button></details><p class="review-status" id="review-status" aria-live="polite"></p></aside><section class="phone" aria-label="iOS journey preview"><div class="statusbar" aria-hidden="true"><span>9:41</span><span>••• ▰</span></div><div id="app"></div><div class="bar" aria-hidden="true"></div></section></main><script>
(()=>{
const MEALS=[{id:'meal-soho-01',title:'Friday pasta, good conversation',area:'Soho',date:'2026-10-30',time:'19:00 GMT',capacity:4,minimum:3,confirmed:2,budget:35,language:'en',cuisine:'EUROPEAN',diet:'VEGETARIAN_OPTIONS',mood:'EASY_CONVERSATION',venue:'Example Osteria',host:'Maya',intro:'A relaxed meal for people who enjoy travel, books and hearing a new story.'},{id:'meal-soho-02',title:'An unhurried Friday supper',area:'Soho',date:'2026-10-30',time:'20:00 GMT',capacity:4,minimum:2,confirmed:2,budget:45,language:'en',cuisine:'SPANISH',diet:null,mood:'FOOD_DISCOVERIES',venue:'Example Kitchen',host:'Sam',intro:'An easy evening of conversation over a shared meal.'},{id:'meal-camden-03',title:'Saturday neighbourhood lunch',area:'Camden',date:'2026-10-31',time:'13:00 GMT',capacity:2,minimum:2,confirmed:1,budget:25,language:'es',cuisine:null,diet:null,mood:'TRAVEL_CULTURE',venue:'Example Table',host:'Ari',intro:'A small lunch for people settling into London.'}];
function initial(){return {screen:'discover',mode:'map',filter:{area:'Any',dates:[],budget:0,size:0,language:'Any',cuisine:'Any',diet:'Any',mood:'Any',keyword:''},filterDraft:null,selected:MEALS[0].id,explicitMeal:false,account:'guest',fixtureExisting:false,email:'',code:'',issued:0,challenge:0,now:0,profile:{name:'',bio:'',status:'',language:'',interest:'',adult:false,community:false},profileComplete:false,message:'',consent:false,application:null,applications:{},drafts:{},round:0,error:'',fail:null,full:false,closed:false,aiOpen:false,aiConsent:false,aiInput:'',aiReply:'',aiIds:[],aiHard:{},softBudget:35,clearBudget:false,aiDraft:null,aiContext:0,aiPending:null,aiUnsent:'',lastActivity:0,replacePrompt:false,businessWrites:0};}
function currentMeal(s){return MEALS.find(m=>m.id===s.selected)||MEALS[0];}
function otp(s){return ['123456','246810','135790'][(Math.max(1,s.challenge)-1)%3];}
function results(s,hard=s.filter){return MEALS.filter(m=>(!hard.area||hard.area==='Any'||m.area===hard.area)&&(!hard.dates?.length||hard.dates.includes(m.date))&&(!hard.budget||m.budget<=Number(hard.budget))&&(!hard.size||m.capacity===Number(hard.size))&&(!hard.language||hard.language==='Any'||m.language===hard.language)&&(!hard.cuisine||hard.cuisine==='Any'||m.cuisine===hard.cuisine)&&(!hard.diet||hard.diet==='Any'||m.diet===hard.diet)&&(!hard.mood||hard.mood==='Any'||m.mood===hard.mood)&&(!hard.keyword||(m.title+' '+m.venue).toLowerCase().includes(hard.keyword.toLowerCase()))).sort((a,b)=>Number(b.budget<=s.softBudget)-Number(a.budget<=s.softBudget)||a.id.localeCompare(b.id));}
function step(state,e){const s=JSON.parse(JSON.stringify(state));s.error='';switch(e.type){
case 'MODE':s.mode=e.value;break;
case 'FILTER':s.filterDraft=JSON.parse(JSON.stringify(s.filter));s.screen='filters';break;
case 'FILTER_SET':s.filterDraft[e.key]=e.value;break;
case 'DATE':{const a=s.filterDraft.dates;s.filterDraft.dates=a.includes(e.value)?a.filter(x=>x!==e.value):[...a,e.value];break;}
case 'APPLY_FILTER':s.filter=s.filterDraft;s.filterDraft=null;s.screen='discover';break;
case 'CLEAR_FILTER':s.filterDraft={...initial().filter};break;
case 'CANCEL_FILTER':s.filterDraft=null;s.screen='discover';break;
case 'VIEW':if(!MEALS.some(m=>m.id===e.id))break;s.drafts[s.selected]={message:s.message,consent:s.consent};s.selected=e.id;s.application=s.applications[e.id]||null;s.message=s.drafts[e.id]?.message||'';s.consent=s.drafts[e.id]?.consent||false;s.explicitMeal=true;s.screen='detail';s.aiContext++;break;
case 'HOST':s.screen='host';break;
case 'BACK_DETAIL':s.screen='detail';break;
case 'BACK_DISCOVER':s.screen='discover';break;
case 'APPLY':if(s.full||s.closed){s.error=s.full?'This table is full.':'Applications are closed.';break;}s.screen=s.account==='guest'?'account':(!s.profileComplete?'profile':'apply');break;
case 'EMAIL':s.screen='email';break;
case 'EMAIL_INPUT':s.email=e.value;break;
case 'REQUEST':if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s.email.trim())){s.error='Enter a valid email.';break;}if(!s.email.trim().toLowerCase().endsWith('@example.test')){s.error='Use an @example.test address in this preview.';break;}if(s.fail==='auth'){s.fail=null;s.error='We couldn’t request a code. Try again.';break;}s.email=s.email.trim();s.screen='code';s.code='';s.issued=s.now;s.challenge++;break;
case 'CODE':s.code=e.value.replace(/\D/g,'').slice(0,6);break;
case 'VERIFY':if(s.now-s.issued>=300){s.error='This code has expired. Request a new code.';break;}if(s.code!==otp(s)){s.error='That code doesn’t match.';break;}s.account=s.fixtureExisting?'existing':'new';s.profileComplete=s.fixtureExisting||s.profileComplete;s.screen=s.profileComplete?'apply':'profile';s.code='';break;
case 'RESEND':if(s.now-s.issued<30){s.error='Please wait before requesting another code.';break;}s.issued=s.now;s.challenge++;s.code='';break;
case 'CHANGE_EMAIL':s.code='';s.screen='email';break;
case 'OAUTH':s.provider=e.provider;s.screen='oauth';break;
case 'OAUTH_CONTINUE':if(s.fail==='auth'){s.fail=null;s.error='Sign-in was interrupted. Try again.';break;}s.account=s.fixtureExisting?'existing':'new';s.profileComplete=s.fixtureExisting||s.profileComplete;s.screen=s.profileComplete?'apply':'profile';break;
case 'CANCEL_AUTH':s.screen='detail';s.code='';break;
case 'PROFILE_FIELD':s.profile[e.key]=e.value;break;
case 'SAVE_PROFILE':{const p=s.profile;if(p.name.trim().length<2||p.name.trim().length>40||p.bio.trim().length<20||p.bio.trim().length>1000||!p.status||!p.language||!p.interest||!p.adult||!p.community){s.error='Complete the required introduction and confirmations.';break;}if(s.fail==='profile'){s.fail=null;s.error='Your introduction wasn’t saved. Your words are still here.';break;}s.profileComplete=true;s.screen='apply';break;}
case 'MESSAGE':s.message=e.value;break;
case 'CONSENT':s.consent=e.value;break;
case 'SUBMIT':if(s.account==='guest'||!s.profileComplete){s.error='Sign in and complete your introduction first.';break;}if(s.full||s.closed){s.error=s.full?'This table is now full. Your introduction is still here.':'Applications have closed. Your introduction is still here.';break;}if(s.message.trim().length<20||s.message.trim().length>300||!s.consent){s.error='Write 20–300 characters and confirm the arrangements.';break;}if(s.application?.status==='PENDING'){s.screen='pending';break;}if(s.fail==='submit'){s.fail=null;s.error='Couldn’t send your application. Nothing was submitted.';break;}s.round++;s.application={id:'application-'+s.round,mealId:s.selected,status:'PENDING',text:s.message};s.applications[s.selected]={...s.application};s.businessWrites++;s.screen=s.fail==='unknown'?'unknown':'pending';s.fail=null;break;
case 'CHECK_STATUS':s.screen=s.application?'pending':'apply';break;
case 'WITHDRAW_CONFIRM':s.screen='withdraw';break;
case 'WITHDRAW':if(s.application?.status==='PENDING'){s.application.status='WITHDRAWN';s.applications[s.selected]={...s.application};s.businessWrites++;}s.screen='pending';break;
case 'REAPPLY':if(!s.full&&!s.closed&&s.application?.status==='WITHDRAWN')s.screen='apply';else s.error='This meal is no longer open for applications.';break;
case 'AI_OPEN':s.aiOpen=true;break;
case 'AI_CLOSE':s.aiOpen=false;break;
case 'AI_CONSENT':s.aiConsent=e.value;break;
case 'AI_INPUT':s.aiInput=e.value;s.aiUnsent=e.value;s.lastActivity=s.now;break;
case 'AI_ASK':{if(!s.aiConsent){s.aiReply='Choose whether to share this question with the assistant first. You can keep browsing manually.';break;}const q=s.aiInput.trim();if(!q||q.length>2000){s.aiReply='Write a question of up to 2,000 characters. Your text is still here.';break;}s.lastActivity=s.now;if(s.fail==='ai'){s.fail=null;s.aiReply='The assistant is unavailable. You can still browse and apply yourself.';break;}if(s.fail==='ai-cost'){s.fail=null;s.aiReply='The assistant’s spending limit has been reached. Normal meal actions are still available.';break;}if(/private|messages|忽略|隐私/i.test(q)){s.aiReply='I can explain public meals and help with your own introduction. I can’t read private messages or apply for you.';break;}if(/Spanish|西班牙/.test(q)&&!e.clarified){s.aiReply='Do you mean Spanish food or Spanish conversation?';s.aiClarify=true;break;}let hard={...s.filter,...s.aiHard};if(s.clearBudget)delete hard.budget;if(/Soho/i.test(q))hard.area='Soho';if(/Camden/i.test(q))hard.area='Camden';if(/Friday|周五|星期五/i.test(q))hard.dates=['2026-10-30'];const money=q.match(/(?:£|预算\s*)(\d+)/);if(money){hard.budget=Number(money[1]);s.clearBudget=false;}if(/4 people|4人|四人/i.test(q))hard.size=4;if(/any budget|不限预算/i.test(q)){delete hard.budget;s.clearBudget=true;}if(/any area|任何区域/i.test(q))hard.area='Any';if(/Spanish food/.test(q))hard.cuisine='SPANISH';if(/Spanish conversation/.test(q))hard.language='es';s.aiHard=hard;const found=results({...s,softBudget:s.clearBudget?0:s.softBudget},hard).slice(0,3);s.aiIds=found.map(x=>x.id);s.aiReply=found.length?(q.match(/[\u4e00-\u9fff]/)?'以下是符合明确条件的饭局；保存偏好仅用于排序。请打开详情核对最新状态。':'These meals match your explicit conditions. Saved preferences only affect order. Open a meal to check its latest status.'):'No meals match these conditions. You can explicitly relax one condition; I haven’t changed your filters.';break;}
case 'AI_CLARIFY':s.aiInput=e.value;s.aiClarify=false;return step(s,{type:'AI_ASK',clarified:true});
case 'AI_COMPARE':s.aiReply=s.aiIds.map(id=>{const m=MEALS.find(x=>x.id===id);return m.title+': '+m.area+', £'+m.budget+', table for '+m.capacity+', '+({en:'English',es:'Spanish'}[m.language]||m.language);}).join('\n')||'Choose meals from a result first.';break;
case 'AI_EXPLAIN':s.aiReply=s.application?.status==='PENDING'?'Your application is waiting for the host. Pending does not reserve a seat.':'The budget is an estimate. The host books externally and everyone pays at the restaurant. Applying never guarantees a seat.';break;
case 'AI_DRAFT':if(!s.explicitMeal){s.aiReply='Choose a meal before asking for an introduction.';break;}if(!s.aiConsent){s.aiReply='Choose whether to use the assistant first.';break;}if(s.full||s.closed){s.aiReply='This meal is no longer accepting applications. Your text is unchanged.';break;}s.aiDraft={mealId:s.selected,context:s.aiContext,text:'Hi! I would enjoy meeting new people over a relaxed meal and hearing everyone’s stories.'};s.aiReply='Here is a draft. You can transfer it, edit it and send it yourself.';break;
case 'AI_TRANSFER':if(!s.aiDraft||s.aiDraft.mealId!==s.selected||s.aiDraft.context!==s.aiContext||s.full||s.closed){s.aiReply='The meal or editor changed. Your original text is unchanged.';break;}if(s.message&&!e.replace){s.replacePrompt=true;break;}s.message=s.aiDraft.text;s.replacePrompt=false;s.aiOpen=false;if(s.account==='guest')s.screen='account';else s.screen=s.profileComplete?'apply':'profile';break;
case 'KEEP_TEXT':s.replacePrompt=false;s.aiOpen=false;break;
case 'NEW_CONVERSATION':s.aiInput='';s.aiUnsent='';s.aiReply='';s.aiIds=[];s.aiHard={};s.aiDraft=null;s.aiContext++;s.lastActivity=s.now;break;
case 'ADVANCE':s.now+=e.seconds;if(s.now-s.lastActivity>=1800){s.aiReply='The previous conversation expired. Your unsent words are still here.';s.aiHard={};s.aiIds=[];s.aiDraft=null;s.aiContext++;s.lastActivity=s.now;}break;
case 'FAULT':s.fail=e.value;break;
case 'FULL':s.full=e.value;break;
case 'CLOSED':s.closed=e.value;break;
case 'EXISTING':s.fixtureExisting=e.value;break;
}return s;}

const reviewPrd=document.getElementById('review-prd');if(location.protocol!=='file:'&&/^\/j01\/(?:index\.html)?$/.test(location.pathname))reviewPrd.setAttribute('href','../#prd-j01');
let s=initial();const app=document.getElementById('app');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const button=(label,event,cls='primary',extra='')=>`<button class="${cls}" data-event="${event}" ${extra}>${label}</button>`;
function go(e){s=step(s,e);render();}const error=()=>`<p class="error" role="alert">${esc(s.error)}</p>`;
const label=x=>({en:'English',es:'Spanish',EUROPEAN:'European',SPANISH:'Spanish',VEGETARIAN_OPTIONS:'Vegetarian options',EASY_CONVERSATION:'Easy conversation',FOOD_DISCOVERIES:'Food discoveries',TRAVEL_CULTURE:'Travel and culture'}[x]||x||'Not provided');
const card=m=>`<article class="card"><span class="badge">${esc(m.area)} · ${esc(m.date)}</span><h3>${esc(m.title)}</h3><p>${esc(m.venue)} · ${esc(m.time)}<br>Up to £${m.budget} per person · Table for ${m.capacity}<br>${m.capacity-m.confirmed} places left · ${esc(label(m.language))}</p>${button('View meal','VIEW','secondary',`data-id="${m.id}"`)}</article>`;
const select=(id,label,options,value)=>`<label class="label" for="${id}">${label}</label><select id="${id}">${options.map(([v,t])=>`<option value="${v}" ${String(value)===String(v)?'selected':''}>${t}</option>`).join('')}</select>`;
function ai(){if(!s.aiOpen)return '';return `<div class="card" id="assistant"><div class="row"><h3>Ask Fancy</h3>${button('Close','AI_CLOSE','link')}</div><p class="tiny">Help finding meals and writing your own introduction. You choose what to send.</p><label class="check"><input type="checkbox" id="ai-consent" ${s.aiConsent?'checked':''}>I agree to share this request and necessary meal context with DeepSeek. Private messages are not included. I can keep browsing without it.</label><label class="label" for="ai-input">Your question</label><textarea id="ai-input" maxlength="2200">${esc(s.aiInput)}</textarea>${button('Ask','AI_ASK')}${button('Explain my current status','AI_EXPLAIN','link')}${button('Compare these meals','AI_COMPARE','link')}${button('New conversation','NEW_CONVERSATION','link')}<p style="white-space:pre-line" id="ai-reply">${esc(s.aiReply)}</p>${s.aiClarify?button('Spanish food','AI_CLARIFY','secondary','data-value="Spanish food"')+button('Spanish conversation','AI_CLARIFY','secondary','data-value="Spanish conversation"'):''}${s.aiIds.map(id=>card(MEALS.find(x=>x.id===id))).join('')}${button('Draft an introduction for this meal','AI_DRAFT','secondary')}${s.aiDraft?`<p id="ai-draft">${esc(s.aiDraft.text)}</p>${button('Transfer to introduction','AI_TRANSFER')}`:''}${s.replacePrompt?`<p>Your introduction already has text. Keep it or replace it?</p>${button('Keep my text','KEEP_TEXT','secondary')}${button('Replace with draft','AI_TRANSFER','primary','data-replace="true"')}`:''}</div>`;}
function render(){let body='';const m=currentMeal(s);const back=button('Back to meals','BACK_DISCOVER','link');
if(s.screen==='discover'){const found=results(s);body=`<p class="tiny">MEET NEW PEOPLE OVER A MEAL</p><h2>Fancy a bite?</h2><p>Find a table that fits your day.</p><div class="row">${button('Map','MODE','chip '+(s.mode==='map'?'active':''),'data-value="map"')}${button('List','MODE','chip '+(s.mode==='list'?'active':''),'data-value="list"')}${button('Filters','FILTER','chip')}</div>${s.mode==='map'?`<div class="map" aria-label="Neighbourhood overview"><button class="pin" style="top:35px;left:30px" data-region="Soho">Soho · ${found.filter(x=>x.area==='Soho').length}</button><button class="pin" style="top:84px;left:170px" data-region="Camden">Camden · ${found.filter(x=>x.area==='Camden').length}</button></div>`:''}<p class="tiny">${found.length} meals · London local time</p>${found.length?found.map(card).join(''):`<h3>No meals match.</h3><p>Try changing a filter.</p>${button('Change filters','FILTER','secondary')}`}`;}
if(s.screen==='filters'){const f=s.filterDraft;body=`<h2>Your kind of table.</h2><p>Changes apply only when you choose Show meals.</p><label class="label">Dates</label>${['2026-10-30','2026-10-31'].map(x=>button(x==='2026-10-30'?'Fri 30 Oct':'Sat 31 Oct','DATE','chip '+(f.dates.includes(x)?'active':''),`data-value="${x}"`)).join('')}${select('area','Area',[['Any','Any area'],['Soho','Soho'],['Camden','Camden']],f.area)}${select('size','Table size',[[0,'Any size'],[2,'2 people'],[3,'3 people'],[4,'4 people'],[5,'5 people'],[6,'6 people']],f.size)}${select('budget','Maximum budget',[[0,'Any budget'],[25,'£25'],[35,'£35'],[50,'£50']],f.budget)}${select('language','Conversation language',[['Any','Any'],['en','English'],['es','Spanish']],f.language)}${select('cuisine','Cuisine',[['Any','Any'],['EUROPEAN','European'],['JAPANESE','Japanese'],['SPANISH','Spanish'],['CHINESE','Chinese']],f.cuisine)}${select('diet','Host-reported dietary option',[['Any','Any'],['VEGETARIAN_OPTIONS','Vegetarian options'],['VEGAN','Vegan']],f.diet)}${select('mood','Atmosphere',[['Any','Any'],['EASY_CONVERSATION','Easy conversation'],['FOOD_DISCOVERIES','Food discoveries'],['TRAVEL_CULTURE','Travel and culture']],f.mood)}<label class="label" for="keyword">Meal or restaurant</label><input id="keyword" value="${esc(f.keyword)}">${button('Show '+results(s,f).length+' meals','APPLY_FILTER')}${button('Clear all','CLEAR_FILTER','secondary')}${button('Cancel changes','CANCEL_FILTER','link')}`;}
if(s.screen==='detail'){body=`${back}<span class="badge">${esc(m.area)} · London</span><h2>${esc(m.title)}</h2><p>${esc(m.venue)}<br>${m.date} · ${m.time}<br>Table for ${m.capacity} including host · ${m.confirmed} confirmed<br>Estimated up to £${m.budget} per person</p><p>${esc(m.intro)}</p><ul class="facts"><li>Host books externally; pay at the restaurant.</li><li>${esc(label(m.cuisine))} · ${esc(m.diet?label(m.diet):'Dietary information not provided')}</li><li>Host-reported options are not an allergy guarantee.</li><li>Applications close 60 minutes before the meal.</li></ul>${button('Meet '+m.host,'HOST','secondary')}${s.application?.status==='PENDING'?button('View your application','CHECK_STATUS'):button(s.full?'Table full':s.closed?'Applications closed':'Apply to join','APPLY','primary',(s.full||s.closed)?'disabled':'')}${error()}`;}
if(s.screen==='host')body=`${button('Back to meal','BACK_DETAIL','link')}<h2>${esc(m.host)}</h2><p>${esc(m.intro)}</p><p>English · Books · Travel</p><p class="tiny">Only public introduction and published feedback are visible here. No public star ranking.</p>`;
if(s.screen==='account')body=`${button('Back to meal','CANCEL_AUTH','link')}<h2>Your table is waiting.</h2><p>Sign in to apply. You’ll return to this same meal.</p>${button('Continue with email','EMAIL')}${button('Continue with Google','OAUTH','secondary','data-provider="Google"')}${button('Continue with Apple','OAUTH','secondary','data-provider="Apple"')}<p class="tiny">No application is sent by signing in.</p>`;
if(s.screen==='email')body=`${button('Cancel sign-in','CANCEL_AUTH','link')}<h2>Your email.<br>Your way in.</h2><form id="email-form" novalidate><label class="label" for="email">Email address</label><input id="email" type="email" placeholder="alex@example.test" value="${esc(s.email)}">${error()}<button class="primary">Send code</button></form>`;
if(s.screen==='code')body=`${button('Cancel sign-in','CANCEL_AUTH','link')}<h2>Check your inbox.</h2><p>Enter the 6-digit code for ${esc(s.email)}.</p><form id="code-form"><label class="label" for="code">Code</label><input id="code" inputmode="numeric" maxlength="6" value="${esc(s.code)}">${error()}<button class="primary">Verify email</button></form>${button('Use another email','CHANGE_EMAIL','link')}${button(s.now-s.issued<30?'Resend in '+(30-(s.now-s.issued))+'s':'Resend code','RESEND','secondary',s.now-s.issued<30?'disabled':'')}`;
if(s.screen==='oauth')body=`${button('Cancel','CANCEL_AUTH','link')}<h2>Continue with ${esc(s.provider)}.</h2><p>After you return, Fancy checks whether your public introduction is complete.</p>${error()}${button('Continue','OAUTH_CONTINUE')}`;
if(s.screen==='profile')body=`${button('Back to meal','CANCEL_AUTH','link')}<h2>A little about you.</h2><p>This introduction is public. Share only what you want others to know.</p><form id="profile-form"><label class="label" for="name">Name</label><input id="name" maxlength="40" value="${esc(s.profile.name)}"><label class="label" for="bio">Introduction · 20–1000 characters</label><textarea id="bio" maxlength="1001">${esc(s.profile.bio)}</textarea>${select('status','In London',[['','Choose'],['resident','Living here'],['new','New in town'],['visiting','Visiting']],s.profile.status)}${select('language','Language',[['','Choose'],['en','English'],['es','Spanish']],s.profile.language)}${select('interest','An interest',[['','Choose'],['Books','Books'],['Food','Food'],['Travel','Travel']],s.profile.interest)}<label class="check"><input id="adult" type="checkbox" ${s.profile.adult?'checked':''}>I’m 18 or older.</label><label class="check"><input id="community" type="checkbox" ${s.profile.community?'checked':''}>I agree to be respectful and follow the community rules.</label>${error()}<button class="primary">Save introduction and continue</button></form>`;
if(s.screen==='apply')body=`${button('Back to meal','BACK_DETAIL','link')}<span class="badge">${esc(m.title)}</span><h2>Say a little hello.</h2><p>Introduce yourself to ${esc(m.host)}. Pending applications do not reserve a seat.</p><form id="apply-form"><label class="label" for="message">Your introduction · 20–300 characters</label><textarea id="message" maxlength="501">${esc(s.message)}</textarea><label class="check"><input id="consent" type="checkbox" ${s.consent?'checked':''}>I’ve read the arrangements and understand the host reviews applications.</label>${error()}<button class="primary">Send application</button></form>`;
if(s.screen==='unknown')body=`<h2>Let’s check that.</h2><p>We couldn’t confirm the response. Your introduction is kept. Check the original request before trying again.</p>${button('Check application status','CHECK_STATUS')}`;
if(s.screen==='pending')body=`<div class="success">${s.application?.status==='PENDING'?'✓':'↩'}</div><h2>${s.application?.status==='PENDING'?'Your hello is sent.':'Application withdrawn.'}</h2><p>${esc(m.title)}</p><span class="badge">${s.application?.status==='PENDING'?'Waiting for the host':'Withdrawn'}</span><p>${s.application?.status==='PENDING'?'The host will review your introduction. You do not have a confirmed seat or access to the group yet.':'No seat was reserved. If the table is still open, you can send a new application.'}</p><p class="tiny">Reference: ${esc(s.application?.id)}</p>${s.application?.status==='PENDING'?button('Withdraw application','WITHDRAW_CONFIRM','secondary'):button('Apply again','REAPPLY')}${button('Back to meal','BACK_DETAIL','link')}${error()}`;
if(s.screen==='withdraw')body=`<h2>Withdraw your hello?</h2><p>The host will no longer review this application. If the table is still open, you may apply again.</p>${button('Withdraw application','WITHDRAW')}${button('Keep application','CHECK_STATUS','secondary')}`;
app.innerHTML=`<section class="screen"><div class="nav"><span class="brand">fancy</span>${button('Ask Fancy','AI_OPEN','link')}</div>${body}${ai()}</section>`;
app.querySelectorAll('[data-event]').forEach(el=>el.onclick=()=>go({type:el.dataset.event,value:el.dataset.value,id:el.dataset.id,provider:el.dataset.provider,replace:el.dataset.replace==='true'}));
app.querySelectorAll('[data-region]').forEach(el=>el.onclick=()=>{go({type:'FILTER'});go({type:'FILTER_SET',key:'area',value:el.dataset.region});go({type:'APPLY_FILTER'});});
const bind=(id,ev,key,check=false)=>{const el=document.getElementById(id);if(el)el.addEventListener(check?'change':'input',()=>{s=step(s,{type:ev,key,value:check?el.checked:el.value});});};
bind('email','EMAIL_INPUT');bind('code','CODE');bind('message','MESSAGE');bind('consent','CONSENT',null,true);bind('ai-input','AI_INPUT');bind('ai-consent','AI_CONSENT',null,true);
for(const key of ['name','bio','status','language','interest','adult','community'])if(s.screen==='profile')bind(key,'PROFILE_FIELD',key,['adult','community'].includes(key));
if(s.screen==='filters')for(const key of ['area','size','budget','language','cuisine','diet','mood','keyword']){const el=document.getElementById(key);el?.addEventListener('change',()=>go({type:'FILTER_SET',key,value:el.value}));}
for(const [id,type] of [['email-form','REQUEST'],['code-form','VERIFY'],['profile-form','SAVE_PROFILE'],['apply-form','SUBMIT']])document.getElementById(id)?.addEventListener('submit',e=>{e.preventDefault();go({type});});
document.getElementById('review-status').textContent=`场景 ${s.screen} · meal ${s.selected} · 合成码 ${otp(s)} · 时钟 ${s.now}s · 申请 ${s.application?.status||'NONE'} · 写入 ${s.businessWrites} · 条件 ${JSON.stringify(s.filter)} · AI草稿不等于提交`;
}
document.getElementById('reset').onclick=()=>{s=initial();render();};document.getElementById('advance30').onclick=()=>go({type:'ADVANCE',seconds:30});document.getElementById('advance300').onclick=()=>go({type:'ADVANCE',seconds:300});document.getElementById('advance1800').onclick=()=>go({type:'ADVANCE',seconds:1800});document.getElementById('fault').onchange=e=>go({type:'FAULT',value:e.target.value});document.getElementById('full').onchange=e=>go({type:'FULL',value:e.target.checked});document.getElementById('closed').onchange=e=>go({type:'CLOSED',value:e.target.checked});document.getElementById('existing').onchange=e=>go({type:'EXISTING',value:e.target.checked});render();

})();
</script></body></html>
