<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Report and follow up · Fancy PM-r01</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f5ef;color:#173d32;font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button,a,input,select,textarea{outline-offset:4px}button{min-height:44px;padding:10px 17px;border:1px solid #cbd5c9;border-radius:8px;background:#fff;color:#173d32;cursor:pointer}button.primary{background:#174d3b;color:white;border-color:#174d3b}button:disabled{opacity:.45;cursor:not-allowed}a{color:#17523e}header{background:#173d32;color:#fff;padding:19px max(22px,calc((100vw - 1280px)/2));display:flex;align-items:center;justify-content:space-between;gap:15px}header b{font:600 26px Georgia,serif;letter-spacing:-1px}main{max-width:1280px;margin:auto;padding:28px 24px}h1,h2{line-height:1.2;letter-spacing:-.5px}h1{font-size:32px;margin:0 0 12px}h2{font-size:21px}p{margin:9px 0}.muted,small{color:#62776b}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:700}.layout{display:grid;grid-template-columns:190px 1fr;gap:30px}nav{display:flex;flex-direction:column;gap:9px}nav button{text-align:left;background:transparent;border:0}nav button[aria-current=page]{background:#dee8da;font-weight:700}.panel{padding:22px;background:#fff;border:1px solid #dbe1d6;border-radius:12px;margin:18px 0}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:end}.row>*{flex:1;min-width:130px}label{display:block;font-size:13px;font-weight:600}input,select,textarea{width:100%;padding:11px;border:1px solid #bccbbf;border-radius:7px;background:#fff;color:#173d32}textarea{min-height:100px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.metric{text-align:left;padding:20px;min-height:150px}.metric strong{display:block;font-size:34px;margin:10px 0}.metric small{display:block}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;border-bottom:1px solid #dce4d8;padding:12px;font-size:13px}th{color:#62776b;font-weight:500}.badge{display:inline-block;background:#e7eee2;padding:3px 10px;border-radius:20px;font-size:12px}.error{background:#fff1e9;color:#873b21;padding:13px;border-radius:8px}.status{background:#e7eee2;padding:13px;border-radius:8px}.toolbar{display:flex;justify-content:space-between;gap:15px;align-items:center}.drawer{position:fixed;inset:0 0 0 auto;background:white;width:min(560px,100vw);padding:26px;overflow:auto;box-shadow:-15px 0 100px #173d3233;z-index:3}.backdrop{position:fixed;inset:0;background:#142b2944;z-index:2}.review{max-width:1280px;margin:20px auto;padding:16px 24px;border-top:1px dashed #a5b4a6;color:#62776b}.review summary{cursor:pointer;font-weight:600}.review .row{margin-top:14px}.phone{max-width:420px;margin:0 auto}.phone main{padding:24px 20px}.phone header{padding:18px 20px}.phone h1{font-size:29px}.phone .panel{padding:18px}.phone .row>*{min-width:100px}.phone .actions{display:flex;gap:10px;margin-top:20px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}ul{padding-left:22px}.divider{border-top:1px solid #dce4d8;margin:22px 0}pre{white-space:pre-wrap;word-break:break-word;font:12px/1.5 ui-monospace,monospace}@media(max-width:880px){.layout{grid-template-columns:1fr}nav{flex-direction:row;overflow:auto}nav button{white-space:nowrap}.cards{grid-template-columns:1fr 1fr}main{padding:20px 16px}.toolbar{align-items:start}}@media(max-width:480px){.cards{grid-template-columns:1fr}.row>*{min-width:100%}h1{font-size:27px}.panel{padding:16px}}</style></head><body class=""><div id="app"></div><script>

class Model{
constructor(){this.actor='U-REPORTER';this.target='U-424';this.targetType='member';this.screen='target';this.reason='';this.details='';this.error='';this.notice='';this.next='success';this.requests=0;this.records=[];this.current=null;this.unknownIntent=null;this.returnScreen='target';}
start(){if(!this.actor){this.error='Sign in to submit a private report.';return false;}this.screen='form';this.error='';return true;}
cancel(){this.screen=this.returnScreen;this.error='';}
submit(reason,details){this.reason=reason;this.details=details;this.error='';if(!this.actor){this.error='Sign in before submitting.';return false;}if(!['harassment','safety','other'].includes(reason)){this.error='Choose a reason for your report.';return false;}if(this.unknownIntent){this.error='Check the original request before sending again.';return false;}if(this.next==='failure'){this.next='success';this.error='Your report was not sent. Your description is kept; please try again.';return false;}const intent='REPORT-INTENT-'+(this.requests+1);this.requests++;const r={id:'SYN-R'+this.requests,owner:this.actor,target:this.target,targetType:this.targetType,reason,details,status:'RECEIVED',reply:null,intent};this.records.push(r);this.current=r.id;if(this.next==='unknown'){this.unknownIntent=intent;this.screen='unknown';this.notice='We could not confirm whether your report was received. Check this request before trying again.';}else{this.screen='receipt';this.notice='Received. We will review your report.';}this.next='success';return true;}
lookup(){const r=this.records.find(x=>x.intent===this.unknownIntent&&x.owner===this.actor);if(!r){this.error='This request is not available to this account.';return false;}this.current=r.id;this.unknownIntent=null;this.screen='receipt';this.notice='Your original report was received. It was not sent again.';return true;}
receipt(id=this.current){return this.records.find(r=>r.id===id&&r.owner===this.actor)||null;}
list(){return this.records.filter(r=>r.owner===this.actor);}
open(id){if(!this.receipt(id)){this.error='This report is not available to this account.';return false;}this.current=id;this.screen='receipt';return true;}
support(status){const r=this.records.find(r=>r.id===this.current);if(!r)return false;if(status==='IN_PROGRESS'&&r.status==='RECEIVED'){r.status=status;return true;}if(status==='REPLIED'&&r.status==='IN_PROGRESS'){r.status=status;r.reply='We reviewed the information you provided. You can leave the group or block the member if you wish. Contact support if the issue continues.';return true;}return false;}
switchActor(actor){this.actor=actor;this.screen='list';this.current=null;this.details='';this.reason='';this.unknownIntent=null;this.error='';this.notice='';}
}

window.PMModel=Model;

const m=new Model();window.pm=m;const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const statusLabel={RECEIVED:'Received · awaiting review',IN_PROGRESS:'In progress',REPLIED:'Reply available'};
function main(){if(m.screen==='target')return `<p class="eyebrow">Member profile</p><div style="width:72px;height:72px;border-radius:50%;background:#dce6d6;display:grid;place-items:center;font-size:26px">AL</div><h1>Alex</h1><p>Enjoys sharing food and discovering new places.</p><section class="panel"><h2>Need help with this member?</h2><p>Your report is private. It will not be shown to this member or the group.</p><button class="primary" data-act="start">Report member</button></section><button data-act="list">Your reports</button>`;
if(m.screen==='form')return `<p class="eyebrow">Private report</p><h1>Tell us what happened</h1><p>Reporting Alex · ${e(m.target)}</p><form id="report"><label>Reason<select id="reason"><option value="">Choose a reason</option>${[['harassment','Harassment or unwanted contact'],['safety','Safety concern'],['other','Something else']].map(([v,t])=>`<option value="${v}" ${m.reason===v?'selected':''}>${t}</option>`).join('')}</select></label><label style="margin-top:16px">What would you like us to know? <span class="muted">(optional)</span><textarea id="details" placeholder="Share the information you want our support team to review.">${e(m.details)}</textarea></label><p class="muted">Only the support people authorised for this report can review the necessary information. Submitting does not mean it has been investigated.</p><div class="actions"><button class="primary">Send private report</button><button type="button" data-act="cancel">Cancel</button></div></form>`;
if(m.screen==='unknown')return `<h1>Check your report</h1><p class="status">${e(m.notice)}</p><p>Your words are kept. Please check the original request before submitting again.</p><button class="primary" data-act="lookup">Check original request</button>`;
if(m.screen==='list')return `<p class="eyebrow">Your support</p><h1>Your reports</h1>${m.list().length?m.list().map(r=>`<section class="panel"><p>${r.id} · ${e(r.target)}</p><h2>${statusLabel[r.status]}</h2><button data-report="${r.id}">View report</button></section>`).join(''):`<section class="panel"><p>You have not submitted any reports with this account.</p></section>`}<button data-act="target">Back to member</button>`;
const r=m.receipt();if(!r)return `<h1>Report unavailable</h1><p>This account cannot read that report.</p><button data-act="list">Back to your reports</button>`;return `<p class="eyebrow">Your private report</p><h1>${statusLabel[r.status]}</h1><p class="muted">Reference ${r.id}</p><section class="panel"><p>${r.status==='RECEIVED'?'We have received your report and will review it. This is a receipt, not a completed investigation.':r.status==='IN_PROGRESS'?'The support team is reviewing your report. A reply will appear here when available.':'The support team has replied to your report.'}</p><p><b>Reason:</b> ${e(r.reason)}</p><p><b>Your description:</b><br>${e(r.details)||'No additional description.'}</p></section>${r.reply?`<section class="panel"><h2>Support reply</h2><p>${e(r.reply)}</p></section>`:''}<div class="actions"><button data-act="refresh">Check for an update</button><button data-act="list">Your reports</button><button data-act="target">Back to member</button></div><p class="muted">This reference is a support locator, not permission to access someone else’s report.</p>`;}
function render(){document.getElementById('app').innerHTML=`<div class="phone"><header><b>Fancy</b><button data-act="back">Back</button></header><main>${main()}${m.error?`<p class="error" role="alert">${e(m.error)}</p>`:''}${m.notice&&m.screen==='receipt'?`<p class="status" role="status">${e(m.notice)}</p>`:''}<div class="divider"></div><p class="muted">If you are in immediate danger, use local emergency services. Fancy is not an emergency response service.</p></main></div><details class="review"><summary>PM review notes · J07 / IOS-0.1.0</summary><p>This is a local synthetic support journey. No report is sent, no real member or support service is contacted. Support updates below simulate the other authorised role; they are not user actions or a completed real investigation.</p><div class="row"><label>Next submission<select id="next">${['success','failure','unknown'].map(v=>`<option ${m.next===v?'selected':''}>${v}</option>`).join('')}</select></label><label>Account<select id="actor">${['U-REPORTER','U-OTHER','signed-out'].map(v=>`<option ${m.actor===v||(!m.actor&&v==='signed-out')?'selected':''}>${v}</option>`).join('')}</select></label><button data-act="support-progress">Support starts review</button><button data-act="support-reply">Support replies</button><button data-act="reset">Reset sample</button></div><p>Accepted requests ${m.requests} · no network or persistence.</p></details>`;}
document.addEventListener('input',ev=>{if(ev.target.id==='details')m.details=ev.target.value;});document.addEventListener('change',ev=>{if(ev.target.id==='reason')m.reason=ev.target.value;if(ev.target.id==='next')m.next=ev.target.value;if(ev.target.id==='actor'){m.switchActor(ev.target.value==='signed-out'?null:ev.target.value);render();}});
document.addEventListener('submit',ev=>{if(ev.target.id==='report'){ev.preventDefault();m.submit(document.getElementById('reason').value,document.getElementById('details').value);render();}});
document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;const a=b.dataset.act;if(a==='start')m.start();else if(a==='cancel')m.cancel();else if(a==='lookup')m.lookup();else if(a==='list'){m.screen='list';m.notice='';}else if(a==='target')m.screen='target';else if(a==='back'){if(m.screen==='form')m.cancel();else m.screen='list';}else if(a==='refresh'){m.notice='Status checked. Your report has not been sent again.';}else if(a==='support-progress')m.support('IN_PROGRESS');else if(a==='support-reply')m.support('REPLIED');else if(a==='reset')Object.assign(m,new Model());else if(b.dataset.report)m.open(b.dataset.report);render();});render();

</script></body></html>
