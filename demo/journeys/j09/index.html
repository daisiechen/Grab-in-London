<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>处理举报或出席纠错 · Fancy PM-r02</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f5ef;color:#173d32;font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button,a,input,select,textarea{outline-offset:4px}button{min-height:44px;padding:10px 17px;border:1px solid #cbd5c9;border-radius:8px;background:#fff;color:#173d32;cursor:pointer}button.primary{background:#174d3b;color:white;border-color:#174d3b}button:disabled{opacity:.45;cursor:not-allowed}a{color:#17523e}header{background:#173d32;color:#fff;padding:19px max(22px,calc((100vw - 1280px)/2));display:flex;align-items:center;justify-content:space-between;gap:15px}header b{font:600 26px Georgia,serif;letter-spacing:-1px}main{max-width:1280px;margin:auto;padding:28px 24px}h1,h2{line-height:1.2;letter-spacing:-.5px}h1{font-size:32px;margin:0 0 12px}h2{font-size:21px}p{margin:9px 0}.muted,small{color:#62776b}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:700}.layout{display:grid;grid-template-columns:190px 1fr;gap:30px}nav{display:flex;flex-direction:column;gap:9px}nav button{text-align:left;background:transparent;border:0}nav button[aria-current=page]{background:#dee8da;font-weight:700}.panel{padding:22px;background:#fff;border:1px solid #dbe1d6;border-radius:12px;margin:18px 0}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:end}.row>*{flex:1;min-width:130px}label{display:block;font-size:13px;font-weight:600}input,select,textarea{width:100%;padding:11px;border:1px solid #bccbbf;border-radius:7px;background:#fff;color:#173d32}textarea{min-height:100px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.metric{text-align:left;padding:20px;min-height:150px}.metric strong{display:block;font-size:34px;margin:10px 0}.metric small{display:block}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;border-bottom:1px solid #dce4d8;padding:12px;font-size:13px}th{color:#62776b;font-weight:500}.badge{display:inline-block;background:#e7eee2;padding:3px 10px;border-radius:20px;font-size:12px}.error{background:#fff1e9;color:#873b21;padding:13px;border-radius:8px}.status{background:#e7eee2;padding:13px;border-radius:8px}.toolbar{display:flex;justify-content:space-between;gap:15px;align-items:center}.drawer{position:fixed;inset:0 0 0 auto;background:white;width:min(560px,100vw);padding:26px;overflow:auto;box-shadow:-15px 0 100px #173d3233;z-index:3}.backdrop{position:fixed;inset:0;background:#142b2944;z-index:2}.review{max-width:1280px;margin:20px auto;padding:16px 24px;border-top:1px dashed #a5b4a6;color:#62776b}.review summary{cursor:pointer;font-weight:600}.review .row{margin-top:14px}.phone{max-width:420px;margin:0 auto}.phone main{padding:24px 20px}.phone header{padding:18px 20px}.phone h1{font-size:29px}.phone .panel{padding:18px}.phone .row>*{min-width:100px}.phone .actions{display:flex;gap:10px;margin-top:20px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}ul{padding-left:22px}.divider{border-top:1px solid #dce4d8;margin:22px 0}pre{white-space:pre-wrap;word-break:break-word;font:12px/1.5 ui-monospace,monospace}@media(max-width:880px){.layout{grid-template-columns:1fr}nav{flex-direction:row;overflow:auto}nav button{white-space:nowrap}.cards{grid-template-columns:1fr 1fr}main{padding:20px 16px}.toolbar{align-items:start}}@media(max-width:480px){.cards{grid-template-columns:1fr}.row>*{min-width:100%}h1{font-size:27px}.panel{padding:16px}}</style></head><body class=""><div id="app"></div><script>

class Model{
constructor(){this.role='support';this.mfa=true;this.caseAllowed=true;this.caseId='CASE-SYN-09';this.subject='U-203';this.meal='M-SYN-09';this.status='RECEIVED';this.version=1;this.knownVersion=1;this.end=Date.parse('2026-10-10T20:00:00Z');this.now=Date.parse('2026-10-17T20:00:00Z');this.inRoster=true;this.cancelled=false;this.original={self:'absent',host:'present'};this.corrections=[];this.audit=[];this.error='';this.notice='';this.otherBasis=false;this.next='success';this.outcome='';this.snapshotOld={id:'SYN-BEFORE',present:1,known:2};this.snapshotNew=null;}
authorized(){return this.role==='support'&&this.mfa&&this.caseAllowed;}
read(){if(!this.authorized())return null;return {caseId:this.caseId,subject:this.subject,meal:this.meal,original:{...this.original},effective:this.effective(),status:this.status};}
effective(){return this.corrections.length?this.corrections.at(-1).value:this.original.self||this.original.host||'unknown';}
start(){this.error='';if(!this.authorized()){this.error='403 · 当前没有此个案的支持权限或MFA已失效。';return false;}if(this.status==='RECEIVED')this.status='IN_PROGRESS';return true;}
correct(value,reason,expected=this.knownVersion){this.error='';if(!this.authorized()){this.error='403 · 请重新验证支持身份、MFA及此个案授权。';return false;}if(this.now<this.end+7*864e5){this.error='409 CORRECTION_WINDOW_OPEN · 尚在7天自助窗口，不能由支持逾期纠错。';return false;}if(!this.inRoster||this.cancelled){this.error='不适用：须在开始资格名单且饭局未取消。';return false;}if(!['present','absent'].includes(value)||!reason.trim()){this.error='请选择明确出席结果并填写纠错原因。';return false;}if(expected!==this.version||this.next==='conflict'){if(this.next==='conflict')this.version++;this.knownVersion=this.version;this.next='success';this.error='409 · 当前记录已变化，已载入版本；核对后主动重新提交。';return false;}if(this.next==='failure'){this.next='success';this.error='503 · 未执行纠错，原因和选择已保留。';return false;}const last=this.corrections.at(-1);if(last&&last.value===value&&last.reason===reason.trim()){this.notice='原次修订已经记录，未重复追加。';return true;}this.version++;this.knownVersion=this.version;const correction={caseId:this.caseId,subjectId:this.subject,actorId:'SUPPORT-01',value,reason:reason.trim(),version:this.version,correctedAt:new Date(this.now).toISOString(),operation:'CORR-'+(this.corrections.length+1)};this.corrections.push(correction);this.audit.push({...correction});this.snapshotNew={id:'SYN-AFTER-'+this.version,present:value==='present'?2:1,known:2};this.notice='已追加支持修订；原始本人/host报告保留，资格与新统计已更新。';return true;}
impact(){const eligible=this.effective()==='present';return {publicReview:eligible?'visible':'hidden',experience:eligible?'included':'excluded',connection:eligible||this.otherBasis?'OPEN':'PAUSED',oldSnapshot:{...this.snapshotOld},newSnapshot:this.snapshotNew};}
resolve(outcome){this.error='';if(!this.authorized()){this.error='403 · 此操作需当前个案授权。';return false;}if(this.status!=='IN_PROGRESS'){this.error='请先开始处理此个案。';return false;}if(!outcome.trim()){this.error='请填写提交者可见回复；不包含他人私密材料。';return false;}if(this.next==='failure'){this.next='success';this.error='回复未保存，请保留内容重试。';return false;}this.outcome=outcome.trim();this.status='REPLIED';this.audit.push({caseId:this.caseId,actorId:'SUPPORT-01',operation:'REPLY',at:new Date(this.now).toISOString()});this.notice='已记录处理结果并提供提交者可见回复；受理与实际处理分开。';return true;}
}

window.PMModel=Model;

const m=new Model();window.pm=m;let reason='',value='present',reply='';const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function facts(){const c=m.read();if(!c)return `<section class="panel"><h2>403 · 无权查看此个案</h2><p>请通过内部身份重新认证并取得此个案授权。分析者的统计读取权限不能用于支持操作。</p></section>`;const i=m.impact();return `<section class="panel"><div class="toolbar"><div><p class="eyebrow">${c.caseId}</p><h2>出席记录更正请求</h2></div><span class="badge">${c.status}</span></div><p>事项：提交者请求复核本人出席记录。仅呈现此案必要事实，不提供群聊、单方再约或无关用户材料。</p><p>${c.meal} · ${c.subject} · scheduledEndAt 2026-10-10 21:00 BST</p><p>本人原报告 <b>${c.original.self}</b>；host原报告 <b>${c.original.host}</b>；当前有效结果 <b>${c.effective}</b></p><p class="muted">本人优先，host补缺；窗口外有效支持修订优先，原来源不覆盖。当前UTC ${new Date(m.now).toISOString()}，修订版本 ${m.version}。</p><button data-act="start" ${m.status==='REPLIED'?'disabled':''}>${m.status==='RECEIVED'?'开始处理此案':'已进入处理'}</button></section><section class="panel"><h2>追加逾期纠错</h2><p>只在计划结束满7天、开始名单内且未取消时可执行；结束到第7天前应走本人/host自助报告。</p><form id="correct"><div class="row"><label>明确出席结果<select id="value"><option value="present" ${value==='present'?'selected':''}>出席 present</option><option value="absent" ${value==='absent'?'selected':''}>未出席 absent</option></select></label><label>纠错原因<textarea id="reason">${e(reason)}</textarea></label></div><div class="actions"><button class="primary">追加修订并核对影响</button><button type="button" data-act="cancel-correction">取消本次修改</button></div></form></section><section class="panel"><h2>资格与统计影响</h2><div class="cards"><div><b>公开个人评价</b><p>${i.publicReview}</p></div><div><b>单场体验统计</b><p>${i.experience}</p></div><div><b>持续联系资格</b><p>${i.connection}</p></div></div><p>${i.connection==='OPEN'&&m.otherBasis?'另一有效共同场次仍支持联系，本次纠错不误伤该依据。':'仅依赖本场的资格按更正后事实重算；历史消息与未来发送权限分开。'}</p><p>旧快照 ${i.oldSnapshot.id}: ${i.oldSnapshot.present}/${i.oldSnapshot.known}，保持原asOf不变。</p><p>${i.newSnapshot?'新快照 '+i.newSnapshot.id+': '+i.newSnapshot.present+'/'+i.newSnapshot.known:'尚未追加修订，不虚构新快照已生成。'}</p></section><section class="panel"><h2>回复并记录处理结果</h2><form id="reply"><label>提交者可见回复<textarea id="outcome">${e(reply)}</textarea></label><p class="muted">只包含本案可公开结论或下一步，不包含其他人的举报、聊天、私密意愿或内部调查材料。</p><button class="primary" ${m.status!=='IN_PROGRESS'?'disabled':''}>保存处理结果与回复</button></form>${m.outcome?`<p class="status">${e(m.outcome)}</p>`:''}</section><section class="panel"><h2>修订与审计</h2>${m.audit.map(a=>`<p>${e(a.operation)} · ${e(a.actorId)} · ${e(a.caseId)} ${a.value?'· '+e(a.value)+' · '+e(a.reason)+' · '+e(a.correctedAt):''}</p>`).join('')||'尚无支持写入。'}<p class="muted">原始self=${m.original.self} / host=${m.original.host}始终保留。没有SQL直改或全表读取。</p></section>`;}
function render(){document.getElementById('app').innerHTML=`<header><b>Fancy <span style="font:14px sans-serif">Support</span></b><span>单一个案 · 授权处理</span></header><main><p class="eyebrow">处理一宗明确问题</p><h1>查看事实，留下处理依据</h1><p class="muted">这是一宗个案，不是常规全量出席核实队列。</p>${facts()}${m.error?`<p class="error" role="alert">${e(m.error)}</p>`:''}${m.notice&&m.authorized()?`<p class="status" role="status">${e(m.notice)}</p>`:''}</main><details class="review"><summary>PM review notes · J09 / SUPPORT-0.1.0</summary><p>本地合成个案及支持权限、纠错、传播、回复与审计模型。没有访问真实支持API/数据库，不等于新增客服后台。页面是PM可操作个案示意，未来可由受限CLI/API实现；不承诺此画面成为正式后台新页。</p><div class="row"><label>Role<select id="role">${['support','analyst'].map(v=>`<option ${m.role===v?'selected':''}>${v}</option>`).join('')}</select></label><label>MFA<select id="mfa"><option value="yes" ${m.mfa?'selected':''}>有效</option><option value="no" ${!m.mfa?'selected':''}>失效</option></select></label><label>Case access<select id="access"><option value="yes" ${m.caseAllowed?'selected':''}>本案有权</option><option value="no" ${!m.caseAllowed?'selected':''}>本案无权</option></select></label><label>Next response<select id="next">${['success','conflict','failure'].map(v=>`<option ${m.next===v?'selected':''}>${v}</option>`).join('')}</select></label></div><div class="actions"><button data-act="before7">结束后7天前1毫秒</button><button data-act="at7">精确满7天</button><button data-act="other-basis">${m.otherBasis?'移除':'增加'}另一有效共同场次</button><button data-act="reset">Reset sample</button></div></details>`;}
document.addEventListener('input',ev=>{if(ev.target.id==='reason')reason=ev.target.value;if(ev.target.id==='outcome')reply=ev.target.value;});document.addEventListener('change',ev=>{if(ev.target.id==='value')value=ev.target.value;if(ev.target.id==='role')m.role=ev.target.value;if(ev.target.id==='mfa')m.mfa=ev.target.value==='yes';if(ev.target.id==='access')m.caseAllowed=ev.target.value==='yes';if(ev.target.id==='next')m.next=ev.target.value;if(['role','mfa','access'].includes(ev.target.id))render();});document.addEventListener('submit',ev=>{if(ev.target.id==='correct'){ev.preventDefault();m.correct(value,reason);render();}if(ev.target.id==='reply'){ev.preventDefault();m.resolve(reply);render();}});document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;if(b.tagName==='BUTTON'&&b.type==='submit'&&b.form)return;const a=b.dataset.act;if(a==='start')m.start();else if(a==='cancel-correction'){reason='';value=m.effective();m.error='';}else if(a==='before7')m.now=m.end+7*864e5-1;else if(a==='at7')m.now=m.end+7*864e5;else if(a==='other-basis')m.otherBasis=!m.otherBasis;else if(a==='reset'){Object.assign(m,new Model());reason='';value='present';reply='';}render();});render();

</script></body></html>
