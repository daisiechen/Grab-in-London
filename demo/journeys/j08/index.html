<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account deletion · Fancy PM-r02</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f5ef;color:#173d32;font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button,a,input,select,textarea{outline-offset:4px}button{min-height:44px;padding:10px 17px;border:1px solid #cbd5c9;border-radius:8px;background:#fff;color:#173d32;cursor:pointer}button.primary{background:#174d3b;color:white;border-color:#174d3b}button:disabled{opacity:.45;cursor:not-allowed}a{color:#17523e}header{background:#173d32;color:#fff;padding:19px max(22px,calc((100vw - 1280px)/2));display:flex;align-items:center;justify-content:space-between;gap:15px}header b{font:600 26px Georgia,serif;letter-spacing:-1px}main{max-width:1280px;margin:auto;padding:28px 24px}h1,h2{line-height:1.2;letter-spacing:-.5px}h1{font-size:32px;margin:0 0 12px}h2{font-size:21px}p{margin:9px 0}.muted,small{color:#62776b}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:700}.layout{display:grid;grid-template-columns:190px 1fr;gap:30px}nav{display:flex;flex-direction:column;gap:9px}nav button{text-align:left;background:transparent;border:0}nav button[aria-current=page]{background:#dee8da;font-weight:700}.panel{padding:22px;background:#fff;border:1px solid #dbe1d6;border-radius:12px;margin:18px 0}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:end}.row>*{flex:1;min-width:130px}label{display:block;font-size:13px;font-weight:600}input,select,textarea{width:100%;padding:11px;border:1px solid #bccbbf;border-radius:7px;background:#fff;color:#173d32}textarea{min-height:100px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.metric{text-align:left;padding:20px;min-height:150px}.metric strong{display:block;font-size:34px;margin:10px 0}.metric small{display:block}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;border-bottom:1px solid #dce4d8;padding:12px;font-size:13px}th{color:#62776b;font-weight:500}.badge{display:inline-block;background:#e7eee2;padding:3px 10px;border-radius:20px;font-size:12px}.error{background:#fff1e9;color:#873b21;padding:13px;border-radius:8px}.status{background:#e7eee2;padding:13px;border-radius:8px}.toolbar{display:flex;justify-content:space-between;gap:15px;align-items:center}.drawer{position:fixed;inset:0 0 0 auto;background:white;width:min(560px,100vw);padding:26px;overflow:auto;box-shadow:-15px 0 100px #173d3233;z-index:3}.backdrop{position:fixed;inset:0;background:#142b2944;z-index:2}.review{max-width:1280px;margin:20px auto;padding:16px 24px;border-top:1px dashed #a5b4a6;color:#62776b}.review summary{cursor:pointer;font-weight:600}.review .row{margin-top:14px}.phone{max-width:420px;margin:0 auto}.phone main{padding:24px 20px}.phone header{padding:18px 20px}.phone h1{font-size:29px}.phone .panel{padding:18px}.phone .row>*{min-width:100px}.phone .actions{display:flex;gap:10px;margin-top:20px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}ul{padding-left:22px}.divider{border-top:1px solid #dce4d8;margin:22px 0}pre{white-space:pre-wrap;word-break:break-word;font:12px/1.5 ui-monospace,monospace}@media(max-width:880px){.layout{grid-template-columns:1fr}nav{flex-direction:row;overflow:auto}nav button{white-space:nowrap}.cards{grid-template-columns:1fr 1fr}main{padding:20px 16px}.toolbar{align-items:start}}@media(max-width:480px){.cards{grid-template-columns:1fr}.row>*{min-width:100%}h1{font-size:27px}.panel{padding:16px}}</style></head><body><div id="app"></div><script>

class Model{
constructor(){this.screen='settings';this.now=Date.parse('2026-10-26T12:00:00Z');this.authTime=null;this.authenticated=true;this.userStatus='ACTIVE';this.confirmed=false;this.error='';this.notice='';this.next='success';this.failBarrier='';this.savedReceipt=null;this.serverReceipt=null;this.status=null;this.accepted=0;this.publicReference=null;this.currentStep=0;this.stepFailure=false;this.policyApproved=true;this.supportOpened=false;this.workerSteps=[{id:'provider',label:'Revoke linked identity-provider access',done:false},{id:'content',label:'Remove or de-identify account content',done:false},{id:'analytics',label:'Clear identity links and affected data files',done:false},{id:'policy',label:'Apply approved retention and recovery policy',done:false}];this.effects={sessionsActive:true,consentActive:true,groupIntervalOpen:true,hostUpcoming:'OPEN',guestUpcoming:'CONFIRMED',pendingApplication:'PENDING',startedOtherRosterPreserved:true,publicVisible:true,privacyEpoch:1,oldSnapshotReadable:true,oldExportReadable:true,aiPreferences:true,aiConversation:true,aiEpoch:1};this.events=[];}
review(){if(!this.authenticated){this.error='This account is no longer signed in. Use your saved deletion receipt.';return false;}this.screen='review';this.error='';return true;}
cancel(){if(this.accepted){this.screen='status';return false;}this.screen='settings';this.confirmed=false;this.authTime=null;this.error='';return true;}
reauth(code){if(!this.authenticated){this.error='The business session cannot be restored.';return false;}if(code!=='123456'){this.error='Check the 6-digit code and try again.';return false;}this.authTime=this.now;this.screen='confirm';this.error='';return true;}
prepareReceipt(){if(!this.savedReceipt)this.savedReceipt='synthetic-local-receipt-'+String(this.now);return this.savedReceipt;}
request(){this.error='';if(this.accepted){this.screen='status';this.notice='Your original request is already accepted. It has not been submitted again.';return true;}if(!this.authenticated||this.authTime===null||this.now-this.authTime>300000){this.screen='reauth';this.error='Please verify your identity again before deleting your account.';return false;}if(!this.confirmed){this.error='Confirm that you understand the account-deletion consequences.';return false;}this.prepareReceipt();if(this.failBarrier){this.error='We could not accept your request. Your account has not been changed. Please try again.';this.events.push({type:'BARRIER_ROLLBACK',component:this.failBarrier});this.failBarrier='';return false;}const next={...this.effects,sessionsActive:false,consentActive:false,groupIntervalOpen:false,hostUpcoming:'CANCELLED',guestUpcoming:'LEFT',pendingApplication:'WITHDRAWN',publicVisible:false,privacyEpoch:this.effects.privacyEpoch+1,oldSnapshotReadable:false,oldExportReadable:false,aiPreferences:false,aiConversation:false,aiEpoch:this.effects.aiEpoch+1};this.effects=next;this.authenticated=false;this.userStatus='DELETING';this.serverReceipt=this.savedReceipt;this.status='PENDING';this.accepted++;this.publicReference='SYN-DEL-01';this.events.push({type:'ACCEPTED',status:202,reference:this.publicReference});this.screen=this.next==='lost-response'?'unknown':'status';this.notice=this.next==='lost-response'?'The response was lost. Check your saved receipt to find the original request.':'Your request is accepted. Account access is closed; remaining removal steps are pending.';this.next='success';return true;}
query(){this.error='';if(!this.savedReceipt||this.savedReceipt!==this.serverReceipt){this.screen='support';this.error='Your saved receipt is unavailable. You can contact support without signing in.';return false;}if(this.next==='query-failure'){this.next='success';this.error='Status is temporarily unavailable. Your saved receipt is kept; retry or contact support.';return false;}this.screen='status';this.notice='Status checked. No new deletion request was created.';return true;}
worker(){if(!['PENDING','PROCESSING','NEEDS_SUPPORT'].includes(this.status))return false;if(this.stepFailure){this.stepFailure=false;this.status='NEEDS_SUPPORT';this.notice='A removal step needs attention. Completed steps remain complete.';return false;}this.status='PROCESSING';const step=this.workerSteps.find(s=>!s.done);if(!step)return false;if(step.id==='policy'&&!this.policyApproved){this.status='NEEDS_SUPPORT';this.notice='The required retention and recovery policy must be approved before completion.';return false;}step.done=true;this.currentStep++;if(this.workerSteps.every(s=>s.done)){this.status='COMPLETED';this.userStatus='DELETED';this.notice='The required account-removal steps have completed.';}else this.notice='Removal is processing. Completed steps are retained.';return true;}
readOldExport(){return this.effects.oldExportReadable;}
acceptLateAI(epoch){return this.effects.sessionsActive&&epoch===this.effects.aiEpoch;}
loseReceipt(){this.savedReceipt=null;this.screen='support';}
contact(){this.supportOpened=true;this.notice='Continue in your mail app, or copy the address. Opening a composer is not sending a message.';}
}

window.PMModel=Model;

const m=new Model();window.pm=m;const SUPPORT='xcheniepaut26@gmail.com';const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function content(){if(m.screen==='settings')return `<p class="eyebrow">Your account</p><h1>Settings</h1><section class="panel"><h2>Privacy and account</h2><p>You can leave Fancy and request removal of your account.</p><button data-act="review">Delete account</button></section>`;
if(m.screen==='review')return `<p class="eyebrow">Account deletion</p><h1>Before you leave</h1><p>Read what will happen before you continue.</p><section class="panel"><ul><li>You will be signed out and your public profile and content will be hidden.</li><li>Your upcoming hosted meals will be cancelled. Your upcoming seats and pending applications will be withdrawn.</li><li>Your connections and group access will close. Other people’s existing attendance records will be kept.</li><li>Your AI preferences and active assistant conversation will be cleared.</li><li>Remaining identity-provider and data-removal steps will continue after your request is accepted.</li></ul><p>Some minimal records may need to be retained under the approved privacy and dispute policy. Acceptance is not final completion.</p></section><div class="actions"><button class="primary" data-act="verify">Continue to verify identity</button><button data-act="cancel">Keep my account</button></div>`;
if(m.screen==='reauth')return `<p class="eyebrow">Verify it is you</p><h1>Confirm your identity</h1><p>Use the verification code for your existing account. You are not creating a replacement account.</p><form id="reauth"><label>6-digit code<input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6"></label><div class="actions"><button class="primary">Verify identity</button><button type="button" data-act="cancel">Cancel deletion</button></div></form><p class="muted">Your request will only be accepted after a recent identity check and your final confirmation.</p>`;
if(m.screen==='confirm')return `<p class="eyebrow">Final confirmation</p><h1>Delete your account?</h1><p>You can cancel now. Once accepted, account access will close and the removal process will continue.</p><label style="display:flex;align-items:start;gap:12px"><input type="checkbox" id="confirm" style="width:22px;height:22px;flex:none" ${m.confirmed?'checked':''}>I understand the effects on my profile, upcoming meals, connections and data, and I want to request deletion.</label><div class="actions"><button class="primary" data-act="delete">Request account deletion</button><button data-act="cancel">Keep my account</button></div>`;
if(m.screen==='unknown')return `<p class="eyebrow">Find your request</p><h1>Check your saved receipt</h1><p class="status">${e(m.notice)}</p><p>Do not submit another deletion request. Your saved receipt can show the status even after your account session closes.</p><button class="primary" data-act="query">Check original request</button><button data-act="support">Contact support</button>`;
if(m.screen==='support')return `<p class="eyebrow">Account support</p><h1>We can help you find the next step</h1><p>You do not need to register or sign in to contact support.</p>${m.publicReference?`<p>Public reference: <b>${m.publicReference}</b></p>`:''}<p class="muted">A public reference only helps locate a request. It does not grant access to personal information or restore an account.</p><section class="panel"><a id="support-link" href="mailto:${SUPPORT}">Contact support</a><label style="margin-top:16px">Support email<input id="support-address" readonly value="${SUPPORT}"></label><div class="actions"><button data-act="copy">Copy email address</button></div><p id="copy-status" role="status"></p></section><p>Describe the problem in your own words. Do not include account credentials or your private receipt.</p><button data-act="query">Retry saved receipt</button><button data-act="back-status">Back to deletion status</button>`;
const names={PENDING:'Request accepted',PROCESSING:'Removal in progress',COMPLETED:'Account removal completed',NEEDS_SUPPORT:'Support needed'};return `<p class="eyebrow">Account deletion</p><h1>${names[m.status]||'Receipt unavailable'}</h1>${m.publicReference?`<p class="muted">Public reference ${m.publicReference}</p>`:''}<section class="panel"><p>${m.status==='PENDING'?'Your request is accepted. Sessions, new participation, connections and public access are closed. Remaining removal steps have not finished.':m.status==='PROCESSING'?'The remaining removal steps are in progress. Some completed steps may be irreversible.':m.status==='COMPLETED'?'All required steps for this request have completed under the applicable policy.':m.status==='NEEDS_SUPPORT'?'A remaining step needs attention. Your account remains closed; completed removal steps are preserved.':'Use your saved receipt to check status, or contact support.'}</p><ul>${m.workerSteps.map(s=>`<li>${s.label}: <b>${s.done?'complete':'not complete'}</b></li>`).join('')}</ul></section><div class="actions"><button class="primary" data-act="query">Check status</button><button data-act="support">Contact support</button></div><p class="muted">Checking status does not sign you back in or create a new deletion request.</p>`;}
function render(){document.getElementById('app').innerHTML=`<div class="phone"><header><b>Fancy</b><span>Account</span></header><main>${content()}${m.error?`<p class="error" role="alert">${e(m.error)}</p>`:''}${m.notice&&m.screen!=='unknown'?`<p class="status" role="status">${e(m.notice)}</p>`:''}</main></div><details class="review"><summary>PM review notes · J08 / IOS-0.1.0</summary><p>本地合成删除模型，无真实认证、账号、供应商、数据库、邮件或清理任务。模拟验证码123456；receipt只在当前页面内存预存，不显示或附到链接/日志。正式iOS必须用安全存储及256-bit随机secret并由服务端保存哈希。本原型刷新会重置，不代表真实安全存储或作业已实现。</p><div class="row"><label>Next request/query response<select id="next">${['success','lost-response','query-failure'].map(v=>`<option ${m.next===v?'selected':''}>${v}</option>`).join('')}</select></label><label>Fail synchronous component<select id="barrier"><option value="">None</option>${['sessions','membership','public-hide','privacy-revoke','ai-clear'].map(v=>`<option ${m.failBarrier===v?'selected':''}>${v}</option>`).join('')}</select></label></div><div class="actions"><button data-act="age-auth">Age identity check by 5m 1ms</button><button data-act="worker">Run next removal step</button><button data-act="worker-fail">Fail next removal step</button><button data-act="policy">${m.policyApproved?'Withhold':'Approve synthetic'} policy</button><button data-act="lose-receipt">Lose saved receipt</button><button data-act="old-export">Try old export / late AI</button><button data-act="reset">Reset sample</button></div><p>Accepted deletion requests ${m.accepted} · account ${m.userStatus} · session ${m.authenticated?'active':'closed'} · public ${m.effects.publicVisible?'visible':'hidden'} · privacy epoch ${m.effects.privacyEpoch}</p><p id="review-result"></p></details>`;}
document.addEventListener('change',ev=>{if(ev.target.id==='confirm')m.confirmed=ev.target.checked;if(ev.target.id==='next')m.next=ev.target.value;if(ev.target.id==='barrier')m.failBarrier=ev.target.value;});document.addEventListener('submit',ev=>{if(ev.target.id==='reauth'){ev.preventDefault();m.reauth(document.getElementById('code').value);render();}});document.addEventListener('click',ev=>{const a=ev.target.closest('a');if(a&&a.id==='support-link'){m.contact();setTimeout(render,0);return;}const b=ev.target.closest('button');if(!b)return;if(b.tagName==='BUTTON'&&b.type==='submit'&&b.form)return;const action=b.dataset.act;if(action==='review')m.review();else if(action==='verify')m.screen='reauth';else if(action==='cancel')m.cancel();else if(action==='delete')m.request();else if(action==='query')m.query();else if(action==='support')m.screen='support';else if(action==='back-status'){m.screen='status';m.notice='No message has been marked as sent. Your deletion request remains unchanged.';}else if(action==='age-auth')m.now+=300001;else if(action==='worker')m.worker();else if(action==='worker-fail'){m.stepFailure=true;m.worker();}else if(action==='policy')m.policyApproved=!m.policyApproved;else if(action==='lose-receipt')m.loseReceipt();else if(action==='old-export'){const text='Old export readable: '+m.readOldExport()+' · late old AI accepted: '+m.acceptLateAI(1);document.getElementById('review-result').textContent=text;return;}else if(action==='copy'){const input=document.getElementById('support-address');input.focus();input.select();const output=document.getElementById('copy-status');if(navigator.clipboard?.writeText)navigator.clipboard.writeText(SUPPORT).then(()=>output.textContent='Email address copied.').catch(()=>output.textContent='Copy was not available. The address is selected for manual copying.');else output.textContent='The address is selected. Copy it manually.';return;}else if(action==='reset')Object.assign(m,new Model());render();});render();

</script></body></html>
