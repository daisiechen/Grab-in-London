<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fancy · J06 · PM r01</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9e8df;color:#123f35;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #e96943;outline-offset:3px}.layout{max-width:1040px;padding:42px 30px;margin:auto;display:grid;grid-template-columns:1fr 390px;gap:64px;align-items:start}.review{padding:20px 0;font-size:14px;line-height:1.8}.review h1{font-size:30px;line-height:1.3;letter-spacing:-.04em}.review a{color:#123f35;text-underline-offset:4px}.review p{color:#53675b}.review .note{border-left:2px solid #a6ba8a;padding-left:14px;font-size:12px}.review label{font-size:12px;display:block;margin-top:13px}.review select,.review input{width:100%;padding:8px;background:#f5f2e8;border:1px solid #adb8a2;border-radius:5px}.tool{border:1px solid #a8b49f;background:none;border-radius:5px;color:#123f35;padding:7px 10px;margin:5px 3px 5px 0;font-size:12px}.phone{background:#f5f2e8;border:1px solid #c7cdbf;border-radius:32px;overflow:hidden;min-height:790px;box-shadow:0 16px 40px #123f3510}.statusbar{display:flex;justify-content:space-between;padding:17px 25px;font-size:12px;font-weight:650}.screen{padding:12px 23px 34px;min-height:720px}.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:19px}.brand{font-size:30px;font-weight:800;letter-spacing:-.08em}h2{font-size:29px;letter-spacing:-.035em;line-height:1.15;margin:14px 0}h3{font-size:19px;line-height:1.3;margin:12px 0}p{font-size:14px;line-height:1.6;color:#566b5c}.tiny{font-size:11px;line-height:1.55;color:#5c7062}.label{display:block;font-size:12px;font-weight:600;margin:14px 0 7px}input:not([type=checkbox]),select,textarea{width:100%;padding:11px;border:1px solid #a9b79f;border-radius:8px;background:#fcfbf7;color:#123f35;min-height:44px}textarea{resize:vertical;min-height:92px}.primary,.secondary{width:100%;border:1px solid #123f35;border-radius:10px;padding:13px 12px;min-height:48px;margin-top:12px;font-size:13px;font-weight:650}.primary{background:#123f35;color:#f5f2e8}.secondary{background:none;color:#123f35;border-color:#aab99f}.link{border:0;background:none;color:#355c47;text-decoration:underline;text-underline-offset:3px;font-size:12px;padding:7px 3px;min-height:34px}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.chip{border:1px solid #9fb18d;background:transparent;border-radius:22px;padding:8px 11px;font-size:11px;color:#355b46;margin:4px 3px 4px 0}.chip.active{background:#d7ee79;border-color:#8fab5f}.card{padding:15px;background:#fcfbf5;border:1px solid #d0d8c5;border-radius:12px;margin:12px 0}.card h3{margin:0 0 8px}.card p{font-size:12px;margin:6px 0}.badge{display:inline-block;border-radius:20px;padding:5px 9px;background:#dfe8d0;font-size:10px;font-weight:650}.error{color:#a23c26;font-size:12px;min-height:18px;margin-top:9px}.ok{color:#315d3a;font-size:12px}.divider{border:0;border-top:1px solid #d1d9c5;margin:18px 0}.check{display:flex;gap:9px;align-items:flex-start;font-size:12px;line-height:1.5;margin:12px 0}.check input{margin-top:3px}.map{height:140px;border-radius:12px;background:linear-gradient(20deg,transparent 45%,#f5f2e8 45%,#f5f2e8 52%,transparent 52%),linear-gradient(100deg,#e3e8d9 40%,#f5f2e8 40%,#f5f2e8 45%,#dae3cd 45%);position:relative;border:1px solid #c5d0b9}.pin{position:absolute;padding:7px 10px;border-radius:18px;background:#123f35;color:#f5f2e8;font-size:11px;border:0}.bar{height:5px;width:110px;background:#123f35;border-radius:8px;margin:8px auto 9px}.success{width:54px;height:54px;border-radius:50%;background:#d7ee79;display:grid;place-items:center;font-size:25px;margin:30px 0 20px}.facts{font-size:12px;padding-left:20px;line-height:1.8;color:#516c57}.spaced{margin-top:34px}.review-status{border-top:1px solid #bfc9b5;padding-top:12px;font-size:11px;overflow-wrap:anywhere}@media(max-width:750px){.layout{grid-template-columns:1fr;padding:18px 14px;gap:20px}.review{padding:0;max-width:390px;margin:auto}.review h1{font-size:26px}.phone{width:min(390px,100%);margin:auto}.review .intro{font-size:13px}}
</style></head><body><main class="layout"><aside class="review" lang="zh-CN"><p class="tiny">FANCY · J06 · IOS-0.1.0 · PM-r01</p><h1>自愿表达对Fancy的看法。</h1><p class="intro">问卷与单场评分、出席和饭后7天窗口独立。可提交、返回找回、清除单项、修改并恢复失败。</p><a href="../../../docs/product/journeys/j06/requirements.zh-CN.md">阅读对应PRD ↗</a><p class="note">可交互iOS产品表达；身份、模型、业务数据及外部结果全部合成。直接打开无需服务、网络或持久化。不是原生App、真实认证/AI/删除，未进入UX/RD/QA。</p><details><summary>评审控制（不属于用户产品）</summary><label><input type="checkbox" id="attended">合成用户曾出席（默认未出席）</label><button class="tool" id="fail">下次保存失败</button><button class="tool" id="advance">饭后再推进7天</button><button class="tool" id="reset">重置本旅程</button></details><p class="review-status" id="review-status" aria-live="polite"></p></aside><section class="phone" aria-label="iOS journey preview"><div class="statusbar" aria-hidden="true"><span>9:41</span><span>••• ▰</span></div><div id="app"></div><div class="bar" aria-hidden="true"></div></section></main><script>
(()=>{
const REASONS={company:'The people',conversation:'The conversation',coordination:'Making arrangements',expectations:'My expectations',venue:'The venue',cost:'The cost',other:'Something else'};
function initial(){return {screen:'settings',userId:'user-alex',again:null,reasons:[],saved:null,version:0,error:'',notice:'',fail:false,attended:false,daysAfterMeal:9};}
function step(state,e){const s=JSON.parse(JSON.stringify(state));s.error='';s.notice='';switch(e.type){
case 'OPEN':s.screen='survey';if(s.saved){s.again=s.saved.again;s.reasons=[...s.saved.reasons];}break;
case 'AGAIN':s.again=e.value===true?true:e.value===false?false:null;break;
case 'REASON':if(!Object.hasOwn(REASONS,e.value))break;s.reasons=s.reasons.includes(e.value)?s.reasons.filter(x=>x!==e.value):[...s.reasons,e.value];break;
case 'SAVE':if(s.again===null&&s.reasons.length===0){s.error='Choose an answer or at least one reason before saving.';break;}if(s.fail){s.fail=false;s.error='Your feedback wasn’t saved. Your choices are still here. Try again.';break;}s.version++;s.saved={userId:s.userId,again:s.again,reasons:[...new Set(s.reasons)],version:s.version,submittedAt:'2026-10-26T12:00:'+String(s.version).padStart(2,'0')+'Z'};s.screen='saved';s.notice='Your latest feedback is saved privately.';break;
case 'CANCEL':s.again=s.saved?.again??null;s.reasons=[...(s.saved?.reasons||[])];s.screen='settings';break;
case 'BACK':s.screen='settings';break;
case 'FAIL':s.fail=true;break;
case 'ATTENDANCE':s.attended=e.value;break;
case 'ADVANCE':s.daysAfterMeal+=7;break;
}return s;}

let s=initial();const app=document.getElementById('app');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const b=(l,e,c='primary',v='')=>`<button class="${c}" data-e="${e}" data-value="${v}">${l}</button>`;function go(e){s=step(s,e);render();}
function render(){let h='';if(s.screen==='settings')h=`<h2>Your choices.</h2><p>Sharing your thoughts about Fancy is optional. You can answer even if you haven’t attended a meal.</p><article class="card"><h3>Product survey</h3><p>${s.saved?'You have saved feedback. You can view or update it.':'Tell us about Fancy as a whole, whenever you like.'}</p>${b(s.saved?'View my feedback':'Share my thoughts','OPEN')}</article>`;
if(s.screen==='survey')h=`${b('Cancel','CANCEL','link')}<span class="badge">Optional · private</span><h2>How does Fancy feel?</h2><p>This is about the product overall, not a rating of one meal or another person.</p><h3>Would you join Fancy again?</h3><div class="row">${b('Yes','YES','chip '+(s.again===true?'active':''))}${b('No','NO','chip '+(s.again===false?'active':''))}${b('Not answered','CLEAR','chip '+(s.again===null?'active':''))}</div><h3>What affects your choice?</h3><p class="tiny">Choose any that apply. You can leave this part blank.</p>${Object.entries(REASONS).map(([v,l])=>`<label class="check"><input type="checkbox" data-reason="${v}" ${s.reasons.includes(v)?'checked':''}>${l}</label>`).join('')}<p class="error" role="alert">${esc(s.error)}</p>${b('Save my feedback','SAVE')}<p class="tiny">Your answers are private. They are not added to a meal review.</p>`;
if(s.screen==='saved')h=`<div class="success">✓</div><h2>Thanks for sharing.</h2><p role="status">${esc(s.notice)}</p><article class="card"><h3>Your latest feedback</h3><p>Join again: ${s.saved.again===true?'Yes':s.saved.again===false?'No':'Not answered'}</p><p>${s.saved.reasons.length?s.saved.reasons.map(r=>REASONS[r]).join(' · '):'No reasons selected'}</p></article>${b('Update my feedback','OPEN')}${b('Back to settings','BACK','secondary')}`;
app.innerHTML=`<section class="screen"><div class="nav"><span class="brand">fancy</span></div>${h}</section>`;
app.querySelectorAll('[data-e]').forEach(el=>el.onclick=()=>go({type:el.dataset.e==='YES'||el.dataset.e==='NO'||el.dataset.e==='CLEAR'?'AGAIN':el.dataset.e,value:el.dataset.e==='YES'?true:el.dataset.e==='NO'?false:null}));app.querySelectorAll('[data-reason]').forEach(el=>el.onchange=()=>go({type:'REASON',value:el.dataset.reason}));document.getElementById('review-status').textContent=`合成本人 ${s.userId} · 出席 ${s.attended?'有':'无'} · 饭后 ${s.daysAfterMeal}天（不限制问卷） · 保存版本 ${s.version} · mealId从未进入答案 · again ${String(s.saved?.again??null)}`;
}
document.getElementById('reset').onclick=()=>{s=initial();render();};document.getElementById('fail').onclick=()=>go({type:'FAIL'});document.getElementById('attended').onchange=e=>go({type:'ATTENDANCE',value:e.target.checked});document.getElementById('advance').onclick=()=>go({type:'ADVANCE'});render();

})();
</script></body></html>
