<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>分类与可信导出 · Fancy PM-r01</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f5ef;color:#173d32;font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button,a,input,select,textarea{outline-offset:4px}button{min-height:44px;padding:10px 17px;border:1px solid #cbd5c9;border-radius:8px;background:#fff;color:#173d32;cursor:pointer}button.primary{background:#174d3b;color:white;border-color:#174d3b}button:disabled{opacity:.45;cursor:not-allowed}a{color:#17523e}header{background:#173d32;color:#fff;padding:19px max(22px,calc((100vw - 1280px)/2));display:flex;align-items:center;justify-content:space-between;gap:15px}header b{font:600 26px Georgia,serif;letter-spacing:-1px}main{max-width:1280px;margin:auto;padding:28px 24px}h1,h2{line-height:1.2;letter-spacing:-.5px}h1{font-size:32px;margin:0 0 12px}h2{font-size:21px}p{margin:9px 0}.muted,small{color:#62776b}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:700}.layout{display:grid;grid-template-columns:190px 1fr;gap:30px}nav{display:flex;flex-direction:column;gap:9px}nav button{text-align:left;background:transparent;border:0}nav button[aria-current=page]{background:#dee8da;font-weight:700}.panel{padding:22px;background:#fff;border:1px solid #dbe1d6;border-radius:12px;margin:18px 0}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:end}.row>*{flex:1;min-width:130px}label{display:block;font-size:13px;font-weight:600}input,select,textarea{width:100%;padding:11px;border:1px solid #bccbbf;border-radius:7px;background:#fff;color:#173d32}textarea{min-height:100px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.metric{text-align:left;padding:20px;min-height:150px}.metric strong{display:block;font-size:34px;margin:10px 0}.metric small{display:block}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;border-bottom:1px solid #dce4d8;padding:12px;font-size:13px}th{color:#62776b;font-weight:500}.badge{display:inline-block;background:#e7eee2;padding:3px 10px;border-radius:20px;font-size:12px}.error{background:#fff1e9;color:#873b21;padding:13px;border-radius:8px}.status{background:#e7eee2;padding:13px;border-radius:8px}.toolbar{display:flex;justify-content:space-between;gap:15px;align-items:center}.drawer{position:fixed;inset:0 0 0 auto;background:white;width:min(560px,100vw);padding:26px;overflow:auto;box-shadow:-15px 0 100px #173d3233;z-index:3}.backdrop{position:fixed;inset:0;background:#142b2944;z-index:2}.review{max-width:1280px;margin:20px auto;padding:16px 24px;border-top:1px dashed #a5b4a6;color:#62776b}.review summary{cursor:pointer;font-weight:600}.review .row{margin-top:14px}.phone{max-width:420px;margin:0 auto}.phone main{padding:24px 20px}.phone header{padding:18px 20px}.phone h1{font-size:29px}.phone .panel{padding:18px}.phone .row>*{min-width:100px}.phone .actions{display:flex;gap:10px;margin-top:20px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}ul{padding-left:22px}.divider{border-top:1px solid #dce4d8;margin:22px 0}pre{white-space:pre-wrap;word-break:break-word;font:12px/1.5 ui-monospace,monospace}@media(max-width:880px){.layout{grid-template-columns:1fr}nav{flex-direction:row;overflow:auto}nav button{white-space:nowrap}.cards{grid-template-columns:1fr 1fr}main{padding:20px 16px}.toolbar{align-items:start}}@media(max-width:480px){.cards{grid-template-columns:1fr}.row>*{min-width:100%}h1{font-size:27px}.panel{padding:16px}}</style></head><body class=""><div id="app"></div><script>

class Model{
constructor(){this.role='data-admin';this.classification='regular';this.version=1;this.serverClass='regular';this.serverVersion=1;this.status='READY';this.snapshot='SYN-C1';this.snapshotRevision=1;this.acceptedRevision=1;this.intent=null;this.submissions=0;this.statsAttempts=0;this.reason='';this.error='';this.notice='';this.next='success';this.tickets=[];this.revoked=new Set();this.filters={from:'2026-09-29',to:'2026-10-26',area:'all'};this.audit=[];this.lang='zh';}
save(value,reason){this.error='';if(this.role!=='data-admin'){this.error='403 · 只有数据管理员可以修改分类 / Data-admin required.';return false;}if(this.status!=='READY'){this.error='先查询原次结果或完成统计，不重复保存分类 / Resolve this change first.';return false;}if(!reason.trim()){this.error='请填写修改原因 / A reason is required.';return false;}if(value===this.classification){this.error='分类没有变化 / No classification change.';return false;}if(!['regular','test','staff'].includes(value)){this.error='Invalid classification';return false;}if(this.next==='conflict'){this.serverVersion++;this.serverClass='staff';this.version=this.serverVersion;this.classification=this.serverClass;this.next='success';this.error='409 · 其他管理员已修改；已载入最新值，请重新核对 / Latest value loaded. Confirm a new change.';return false;}if(this.next==='failure'){this.next='success';this.error='503 · 未保存，输入与原因保留 / Not saved; your input is preserved.';return false;}this.submissions++;this.intent='INTENT-'+this.submissions;this.serverVersion++;this.serverClass=value;this.audit.push({intent:this.intent,subject:'U-203',value,reason:reason.trim(),revision:this.serverVersion,actor:'DATA-01'});this.reason=reason;this.status=this.next==='unknown'?'UNKNOWN':'PENDING';if(this.status==='PENDING')this.accept();this.next='success';this.notice=this.status==='UNKNOWN'?'保存结果未知；先查原次结果 / Status unknown; check the original change.':'分类已接受，统计更新中 / Classification accepted; statistics updating.';return true;}
accept(){this.classification=this.serverClass;this.version=this.serverVersion;this.acceptedRevision=this.serverVersion;this.status='PENDING';}
lookup(){if(this.status!=='UNKNOWN'){this.error='没有待查询的未知操作 / No unknown change.';return false;}this.accept();this.notice='已找回原次分类结果，未重复保存 / Original change found; not saved twice.';return true;}
runStats(outcome='success'){if(!['PENDING','FAILED'].includes(this.status)){this.error='当前没有待更新统计 / No statistics job pending.';return false;}this.statsAttempts++;if(outcome==='failure'){this.status='FAILED';this.notice='分类已接受，统计失败；仅重试统计 / Classification accepted; retry statistics only.';return false;}this.status='READY';this.snapshot='SYN-C'+this.acceptedRevision;this.snapshotRevision=this.acceptedRevision;this.notice='统计已就绪，请使用此新快照 / New statistics ready.';return true;}
canRead(){return this.status==='READY'&&this.snapshot&&this.snapshotRevision>=this.acceptedRevision&&!this.revoked.has(this.snapshot)&&['analyst','data-admin'].includes(this.role);}
summary(){if(!this.canRead())return null;return this.classification==='regular'?{present:8,known:10}:{present:6,known:8};}
exportTicket(){if(!this.canRead()){this.error='统计不可用，不能导出旧结果 / Statistics unavailable; old results cannot be exported.';return null;}const s=this.summary(),ticket={id:'EXP-'+(this.tickets.length+1),snapshot:this.snapshot,version:4,filters:{...this.filters},present:s.present,known:s.known};this.tickets.push(ticket);return ticket;}
readTicket(id){const t=this.tickets.find(t=>t.id===id);if(!this.canRead()||!t||t.snapshot!==this.snapshot||this.revoked.has(t.snapshot)||!['analyst','data-admin'].includes(this.role)){this.error='410 / 403 · 下载已失效或无权 / Export revoked or forbidden.';return null;}return 'snapshotId,definitionVersion,from,to,area,metric,numerator,denominator\n'+[t.snapshot,t.version,t.filters.from,t.filters.to,t.filters.area,'present-participations',t.present,t.known].join(',')+'\n';}
revoke(){if(this.snapshot)this.revoked.add(this.snapshot);this.snapshot=null;this.status='REVOKED';this.notice='410 · 此快照及旧下载已撤销 / Snapshot and old downloads revoked.';}
refresh(){this.status='READY';this.snapshot='SYN-C'+this.acceptedRevision+'-privacy';this.snapshotRevision=this.acceptedRevision;this.notice='已切换新的有效快照 / New valid snapshot selected.';}
}

window.PMModel=Model;

const m=new Model();window.pm=m;let draftClass='test',draftReason='',downloadError='';
const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const T=(z,en)=>m.lang==='zh'?z:en;
function render(){const s=m.summary();document.getElementById('app').innerHTML=`<header><b>Fancy <span style="font:14px sans-serif">Insights</span></b><button data-act="locale">${T('English','中文')}</button></header><main><p class="eyebrow">${T('数据与定义','Data and definitions')}</p><h1>${T('让统计回到正确的人群','Count the right people')}</h1><p class="muted">${T('分类只影响统计，不改变账号登录或业务权限。','Classification changes analytics, not account access or meal permissions.')}</p><div class="layout"><nav><button aria-current="page">${T('统计账号分类','Analytics classification')}</button><button data-act="summary">${T('当前统计与导出','Current results & export')}</button></nav><section><section class="panel"><div class="toolbar"><h2>U-203</h2><span class="badge">${e(m.status)}</span></div><p>${T('当前已确认分类','Confirmed classification')}: <b>${e(m.classification)}</b> · revision ${m.version}</p><form id="classify"><label>${T('新分类','New classification')}<select id="classification">${[['regular',T('正式用户','Regular')],['test',T('测试','Test')],['staff',T('员工','Staff')]].map(([v,t])=>`<option value="${v}" ${v===draftClass?'selected':''}>${t}</option>`).join('')}</select></label><label style="margin-top:12px">${T('修改原因','Reason')}<textarea id="reason">${e(draftReason)}</textarea></label><div class="actions"><button class="primary" ${m.status!=='READY'||m.role!=='data-admin'?'disabled':''}>${T('保存分类','Save classification')}</button><button type="button" data-act="cancel">${T('取消修改','Cancel changes')}</button></div></form>${m.error?`<p class="error" role="alert">${e(m.error)}</p>`:''}${m.notice?`<p class="status" role="status">${e(m.notice)}</p>`:''}${m.status==='UNKNOWN'?`<button data-act="lookup">${T('查询原次结果','Check original change')}</button>`:''}${['PENDING','FAILED'].includes(m.status)?`<div class="actions"><button data-act="stats" class="primary">${T(m.status==='FAILED'?'仅重试统计':'查看统计更新结果',m.status==='FAILED'?'Retry statistics only':'Check statistics result')}</button></div>`:''}${m.status==='REVOKED'?`<button data-act="refresh">${T('选择新的有效快照','Select a valid snapshot')}</button>`:''}<p class="muted">${T('测试/员工的事件、申请、参与和反馈排除；其主持饭局整场排除。正式主持场的测试成员不能算入招募峰值。','Test/staff events and contributions are excluded, as are their hosted meals. Test members cannot contribute to a regular host’s recruitment peak.')}</p></section><section class="panel" id="result"><h2>${T('同口径统计与导出','Consistent results and export')}</h2><div class="row"><label>${T('开始日期','From')}<input id="from" type="date" value="${m.filters.from}"></label><label>${T('结束日期','To')}<input id="to" type="date" value="${m.filters.to}"></label><label>${T('区域','Area')}<select id="area"><option value="all">${T('全部','All')}</option><option value="Soho" ${m.filters.area==='Soho'?'selected':''}>Soho</option></select></label><button data-act="filters">${T('应用范围','Apply range')}</button></div>${s?`<p class="eyebrow">${e(m.snapshot)} · asOf 2026-10-26 · definitionVersion 4</p><h2>${s.present} / ${s.known} ${T('明确出席人次','present participations')}</h2><p>${T('页面与导出绑定同一快照、范围、口径；不包含个人原始记录。','Page and export use the same snapshot, filters and definition; no raw personal records.')}</p><button data-act="export" class="primary">${T('生成当前聚合导出','Create aggregate export')}</button>`:`<p class="status">${T('当前统计不可用。分类待查、更新中、失败或撤销时，不展示/下钻/导出旧结果。','Results unavailable. Unknown changes, pending or failed statistics, and revoked snapshots cannot expose old results.')}</p>`}${m.tickets.length?`<h3>${T('导出记录','Export history')}</h3>${m.tickets.map(t=>`<div class="actions"><span>${t.id} · ${t.snapshot} · ${e(t.filters.area)}</span><button data-ticket="${t.id}">${T('读取/下载','Read / download')}</button></div>`).join('')}`:''}${downloadError?`<p class="error">${e(downloadError)}</p>`:''}<div id="csv-result"></div></section><section class="panel"><h2>${T('分类审计','Classification audit')}</h2>${m.audit.map(a=>`<p>${a.intent} · U-203 · ${e(a.value)} · revision ${a.revision} · ${e(a.reason)} · ${a.actor}</p>`).join('')||T('尚未修改','No changes yet')}</section></section></div></main><details class="review"><summary>PM review notes · J11 / ADMIN-0.1.0</summary><p>完全本地合成账号与聚合数；角色、后台响应、统计任务及撤销均为评审模拟，无实际分类写入或真实下载服务。审计保留原意图；不会改业务权限。</p><div class="row"><label>Next classification response<select id="next">${['success','unknown','conflict','failure'].map(v=>`<option ${m.next===v?'selected':''}>${v}</option>`).join('')}</select></label><label>Role<select id="role">${['data-admin','analyst','forbidden'].map(v=>`<option ${m.role===v?'selected':''}>${v}</option>`).join('')}</select></label><button data-act="stats-fail">统计失败</button><button data-act="revoke">隐私撤销当前快照</button><button data-act="reset">Reset sample</button></div><p>分类写入次数 ${m.submissions} · 统计尝试 ${m.statsAttempts} · intent ${m.intent||'—'}</p></details>`;}
document.addEventListener('input',ev=>{if(ev.target.id==='reason')draftReason=ev.target.value;});document.addEventListener('change',ev=>{if(ev.target.id==='classification')draftClass=ev.target.value;if(ev.target.id==='next'){m.next=ev.target.value;}if(ev.target.id==='role'){m.role=ev.target.value;render();}});
document.addEventListener('submit',ev=>{if(ev.target.id==='classify'){ev.preventDefault();m.save(draftClass,draftReason);render();}});
document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;const a=b.dataset.act;if(a==='cancel'){draftClass=m.classification;draftReason='';m.error='';}else if(a==='lookup')m.lookup();else if(a==='stats')m.runStats();else if(a==='stats-fail')m.runStats('failure');else if(a==='revoke')m.revoke();else if(a==='refresh')m.refresh();else if(a==='export')m.exportTicket();else if(a==='summary'){document.getElementById('result').scrollIntoView?.();return;}else if(a==='locale')m.lang=m.lang==='zh'?'en':'zh';else if(a==='filters'){const from=document.getElementById('from').value,to=document.getElementById('to').value;if(!from||!to||from>to||to>'2026-10-26')m.error='请检查日期 / Check date range.';else{m.filters={from,to,area:document.getElementById('area').value};m.error='';}}else if(a==='reset'){Object.assign(m,new Model());draftClass='test';draftReason='';downloadError='';}else if(b.dataset.ticket){const csv=m.readTicket(b.dataset.ticket);if(!csv){downloadError=m.error;render();return;}downloadError='';render();const box=document.getElementById('csv-result'),pre=document.createElement('pre'),link=document.createElement('a');pre.textContent=csv;link.textContent=T('下载CSV（合成评审数据）','Download CSV (synthetic review data)');link.download='fancy-synthetic-aggregate.csv';link.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);box.append(pre,link);return;}render();});render();

</script></body></html>
