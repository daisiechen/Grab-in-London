<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fancy mobile web prototype</title>
<meta name="description" content="Design prototype of Fancy's mobile web: shared meal links, browsing, sign-in and applying. Fictional data; not a live service.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#123f35">
<!--
  Fancy mobile web design prototype (2026-10-28). Design only: no network calls, no real accounts.
  Spec: ../mobile-web-design.zh-CN.md. Visual baseline: apps/ios/src/ui (tokens, PageHeader, MealCard, LinkRow).
  People, meals and images are fictional Demo assets (demo/public/images, resized copies in ./assets).
  In production every meal page would also carry the OG / JSON-LD tags shown in the spec, rendered on the server.
-->
<style>
:root{
  --forest:#123f35;--ink:#10241f;--muted:#6c746f;--line:#e4e7e2;--surface:#f5f6f1;--peach:#ffb49b;
  --danger:#a93b32;--white:#fff;--sec-border:#b8c8bd;--selected:#e8f0ea;--notice:#f2f5ee;--notice-ink:#607160;
  --venue:#46594d;--inactive:#818680;--r-sm:7px;--r-md:11px;--r-lg:19px;
  --page:16px;--bar:83px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#e9ece6;-webkit-font-smoothing:antialiased;font-size:14px;line-height:21px}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--forest);outline-offset:2px;border-radius:6px}
.app{position:relative;max-width:430px;min-height:100vh;margin:0 auto;background:var(--white);box-shadow:0 0 0 1px #dfe3dc;overflow-x:hidden}
.scroll{padding:8px var(--page) calc(var(--bar) + 24px)}
.scroll.has-footer{padding-bottom:110px}
.scroll.no-bar{padding-bottom:28px}
/* Page header: big title + small grey line, no eyebrow (ios-ui-conventions §1) */
.ph{display:flex;flex-direction:column;gap:3px;margin-bottom:12px}
.ph .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ph h1{font-weight:700;color:var(--ink)}
.ph.tab h1{font-size:27px;line-height:31px;letter-spacing:-1.1px}
.ph.page h1{font-size:24px;line-height:28px;letter-spacing:-.8px}
.ph p{font-size:12px;line-height:17px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;min-height:32px;padding:0 11px;border-radius:16px;border:1px solid var(--line);background:#f4f6f1;font-size:13px;font-weight:700;color:var(--forest);white-space:nowrap}
.chip.solid{background:var(--forest);border-color:var(--forest);color:#fff}
/* Detail title row with floating back disc */
.titlebar{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.disc{flex:none;width:36px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center;background:#ffffffee;border:1px solid var(--line);box-shadow:0 2px 4px rgba(16,36,31,.1)}
.titlebar .t{flex:1;min-width:0;padding-top:3px}
.titlebar h1{font-size:24px;line-height:28px;letter-spacing:-.8px;font-weight:700}
.titlebar p{font-size:12px;line-height:17px;color:var(--muted);margin-top:2px}
/* Filters */
.filters{display:flex;gap:8px;align-items:center;margin-bottom:10px;position:relative}
.fbtn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 10px;border:1px solid var(--line);border-radius:var(--r-sm);font-size:12px;font-weight:600;background:#fff;white-space:nowrap}
.fbtn[aria-expanded=true]{border-color:var(--forest);background:var(--selected)}
.fbtn.on{border-color:var(--forest);color:var(--forest)}
.seg{display:inline-flex;margin-left:auto;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.seg button{width:36px;height:32px;display:flex;align-items:center;justify-content:center}
.seg button[aria-pressed=true]{background:var(--forest);color:#fff}
.drop{border:1px solid var(--line);border-radius:var(--r-md);padding:10px;margin:-2px 0 10px;background:#fff;box-shadow:0 6px 18px rgba(16,36,31,.08)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{min-height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line);font-size:12px;font-weight:600;background:#fff}
.opt[aria-pressed=true]{background:var(--selected);border-color:var(--forest);color:var(--forest)}
/* Map */
.map{position:relative;height:230px;margin:0 calc(var(--page) * -1);overflow:hidden;background:#eef0e8}
.map .inner{position:absolute;left:0;width:100%;aspect-ratio:780/900;top:-108px}
.map img{width:100%;height:100%;display:block}
.pin{position:absolute;transform:translate(-50%,-50%);min-width:34px;height:40px;padding:0 10px;border-radius:12px;background:var(--forest);color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(16,36,31,.25)}
.pin[aria-pressed=true]{background:var(--peach);color:var(--ink);width:42px;height:42px;border-radius:21px}
.legend{position:absolute;left:12px;top:10px;background:#ffffffe6;border-radius:9px;padding:3px 8px;font-size:10px;color:var(--muted)}
.sheet-top{position:relative;margin:-14px calc(var(--page) * -1) 0;background:#fff;border-radius:var(--r-lg) var(--r-lg) 0 0;padding:16px var(--page) 0;box-shadow:0 -2px 8px rgba(16,36,31,.06)}
.sheet-top:before{content:"";position:absolute;top:6px;left:50%;width:28px;height:3px;margin-left:-14px;border-radius:2px;background:#cfd5cd}
.listhead{display:flex;justify-content:space-between;align-items:center;margin:2px 0 10px}
.listhead b{font-size:12px}
.link{color:var(--forest);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:5px;min-height:32px}
.sub{font-size:12px;font-weight:600;color:var(--muted);margin:14px 0 8px}
/* Meal card (MealCard dense/compact) */
.cards{display:flex;flex-direction:column;gap:14px}
.card{display:flex;gap:12px;border-radius:10px;text-align:left;width:100%}
.card:active{background:#123f3508}
.photo{flex:none;width:88px;height:96px;border-radius:9px;overflow:hidden;background:var(--surface)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.card .copy{flex:1;min-width:0}
.card h3{font-size:15px;line-height:18px;font-weight:700;letter-spacing:-.3px;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.venue{font-size:11px;line-height:14px;font-weight:600;color:var(--venue);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ln{display:flex;align-items:center;gap:6px;font-size:11px;line-height:15px;color:var(--muted);margin-bottom:2px;white-space:nowrap}
.ln .ic{width:12px;display:flex;justify-content:center;flex:none}
.glyph{font-size:11px;font-weight:700;color:var(--muted)}
.status{font-size:12px;font-weight:700;color:var(--forest);margin-top:3px}
.status.bad{color:var(--danger)}
.av-row{display:flex;gap:5px;margin-top:5px}
.av{flex:none;border-radius:50%;overflow:hidden;background:#ecefe7;display:inline-flex;align-items:center;justify-content:center;color:var(--forest);font-weight:700}
.av img{width:100%;height:100%;object-fit:cover}
/* Skeleton */
.sk{background:linear-gradient(90deg,#eef0ea 0,#f6f7f3 50%,#eef0ea 100%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:6px}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
/* Detail */
.facts{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0;gap:12px 10px;margin-bottom:6px}
.fact{display:flex;gap:8px}
.fact b{display:block;font-size:13px;line-height:17px}
.fact span{display:block;font-size:11px;line-height:15px;color:var(--muted)}
h2{font-size:16px;line-height:20px;font-weight:700;margin:18px 0 9px}
.people{display:flex;gap:14px;overflow-x:auto;padding-bottom:2px}
.person{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;width:60px;font-size:11px;font-weight:600;white-space:nowrap}
.hosttag{font-size:9px;font-weight:700;background:var(--selected);color:var(--forest);padding:0 5px;border-radius:5px;line-height:14px}
.prose{font-size:14px;line-height:21px;color:#3d4a44}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{border:1px solid var(--line);border-radius:20px;padding:5px 11px;font-size:12px}
.caption{font-size:11px;line-height:16px;color:var(--muted);margin-top:8px}
.venuebox{display:flex;gap:12px;align-items:flex-start}
.venuebox .photo{width:64px;height:64px}
.badge{display:inline-block;font-size:10px;line-height:14px;padding:3px 8px;border-radius:7px;background:#f0f3ec;color:#536c5b;margin-top:5px}
.badge.good{background:var(--selected);color:var(--forest);font-weight:700}
.notice{display:flex;gap:9px;padding:12px;border-radius:9px;background:var(--notice);font-size:11px;line-height:17px;color:var(--notice-ink);margin:16px 0}
.notice.warn{background:#fbefed;color:var(--danger)}
/* Footer action bar */
.footer{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;background:#fff;border-top:1px solid var(--line);padding:10px var(--page) max(env(safe-area-inset-bottom),12px);z-index:20}
.footer .hint{font-size:11px;color:var(--muted);text-align:center;margin-bottom:6px}
.btn{width:100%;min-height:45px;border-radius:var(--r-md);padding:12px 16px;display:flex;align-items:center;justify-content:center;gap:9px;border:1px solid var(--forest);background:var(--forest);color:#fff;font-size:13px;font-weight:600}
.btn.sec{background:transparent;color:var(--forest);border-color:var(--sec-border)}
.btn[disabled]{opacity:.5;cursor:default}
.btn+.btn{margin-top:8px}
.textact{display:flex;justify-content:center;align-items:center;min-height:40px;width:100%;color:var(--forest);font-size:13px;font-weight:600}
.textact.danger{color:var(--danger)}
/* Tab bar */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;display:flex;background:#fff;border-top:1px solid var(--line);padding:7px 9px max(env(safe-area-inset-bottom),6px);z-index:20}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px 0;font-size:10px;color:var(--inactive)}
.tabbar a[aria-current=page]{color:var(--forest)}
/* Forms */
.field{margin-bottom:14px}
.field label,.flabel{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.req{color:var(--muted);font-weight:400;margin-left:2px}
.input,.textarea{width:100%;min-height:43px;border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px;background:#fff;font-size:14px}
.textarea{min-height:110px;resize:vertical;line-height:20px}
.input:focus,.textarea:focus{outline:none;border-color:var(--forest);box-shadow:0 0 0 3px #123f3518}
.input.bad,.textarea.bad{border-color:var(--danger)}
.help{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted);margin-top:5px}
.err{font-size:12px;color:var(--danger);margin-top:5px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:19px}
.check input{width:18px;height:18px;margin-top:1px;accent-color:var(--forest);flex:none}
/* Summary card */
.sum{display:block;border:1px solid var(--line);border-radius:var(--r-md);padding:12px;margin:12px 0}
.sum .h{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:15px;line-height:19px}
.sum .l{font-size:12px;color:var(--muted);margin-top:3px}
/* Progress */
.track{display:flex;position:relative;margin:12px 0 4px}
.step{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--muted);position:relative;z-index:1}
.dot{width:24px;height:24px;border-radius:12px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center}
.step.done .dot{background:var(--forest);border-color:var(--forest);color:#fff}
.step.current .dot{background:#5f8a6b;border-color:#5f8a6b;color:#fff}
.step.stopped .dot{background:#fff;border-color:var(--danger);color:var(--danger)}
.step.done,.step.current{color:var(--ink);font-weight:600}
.track .bar{position:absolute;top:11px;height:2px;background:var(--line);width:33.3%}
.track .bar.on{background:var(--forest)}
.quote{font-size:13px;line-height:20px;color:#3d4a44;border-left:3px solid var(--line);padding-left:10px}
/* LinkRow */
.lr{display:flex;align-items:center;gap:12px;min-height:48px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.lr.first{border-top:1px solid var(--line)}
.lr .ci{width:28px;height:28px;border-radius:14px;background:var(--surface);display:flex;align-items:center;justify-content:center;flex:none;color:var(--forest)}
.lr .lb{flex:1;font-size:14px;font-weight:600}
.lr .lb small{display:block;font-size:11px;font-weight:400;color:var(--muted);line-height:15px}
/* Segments (Meals) */
.tabs{display:flex;gap:6px;margin:4px 0 14px}
.tabs button{min-height:34px;padding:0 14px;border-radius:17px;border:1px solid var(--line);font-size:13px;font-weight:600}
.tabs button[aria-selected=true]{background:var(--forest);border-color:var(--forest);color:#fff}
/* Inbox */
.irow{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.irow .mid{flex:1;min-width:0}
.irow b{display:block;font-size:14px;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.irow span{display:block;font-size:12px;line-height:17px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.irow time{font-size:11px;color:var(--muted);align-self:flex-start;margin-top:2px}
.unread{width:8px;height:8px;border-radius:4px;background:var(--forest);flex:none}
.bell{position:relative}
.bell i{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:4px;background:var(--danger)}
/* Chat */
.msgs{display:flex;flex-direction:column;gap:8px;padding-bottom:8px}
.msg{max-width:78%;padding:8px 11px;border-radius:14px;background:var(--surface);font-size:14px;line-height:19px}
.msg small{display:block;font-size:10px;color:var(--muted);margin-bottom:2px;font-weight:700}
.msg.me{align-self:flex-end;background:var(--forest);color:#fff}
.sys{align-self:center;font-size:11px;color:var(--muted);text-align:center}
.composer{display:flex;gap:8px}
.composer .input{flex:1}
.composer .btn{width:auto;padding:0 14px}
/* Empty / error states */
.state{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:40px 12px}
.state h3{font-size:18px;line-height:23px}
.state p{font-size:13px;color:var(--muted);max-width:290px}
.state .btn{margin-top:8px}
/* Sign-in */
.brandbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.word{font-size:22px;font-weight:700;letter-spacing:-.8px;color:var(--forest)}
.art{height:190px;border-radius:var(--r-lg);overflow:hidden;margin-bottom:14px;background:var(--surface)}
.art img{width:100%;height:100%;object-fit:cover;object-position:center 40%}
.signh{font-size:27px;line-height:31px;letter-spacing:-1.1px;font-weight:700}
.lede{font-size:13px;line-height:19px;color:var(--muted);margin:4px 0 14px}
.ctx{display:flex;gap:9px;align-items:center;border:1px solid var(--line);border-radius:var(--r-md);padding:9px 10px;margin-bottom:14px;font-size:12px;line-height:17px}
.divider{display:flex;align-items:center;gap:10px;margin:10px 0;color:var(--muted);font-size:12px}
.divider:before,.divider:after{content:"";flex:1;height:1px;background:var(--line)}
.prov{width:100%;min-height:45px;border:1px solid var(--sec-border);border-radius:var(--r-md);display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:13px;font-weight:600;color:var(--forest)}
.prov+.prov{margin-top:8px}
/* Bottom sheet */
.scrim{position:fixed;inset:0;background:rgba(16,36,31,.35);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.bs{width:100%;max-width:430px;background:#fff;border-radius:var(--r-lg) var(--r-lg) 0 0;padding:18px var(--page) max(env(safe-area-inset-bottom),16px);max-height:85vh;overflow:auto}
.bs h2{margin-top:0}
.bs p{font-size:13px;line-height:20px;color:#3d4a44;margin-bottom:12px}
/* Toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:120px;background:var(--ink);color:#fff;padding:9px 14px;border-radius:20px;font-size:13px;z-index:60;box-shadow:0 4px 12px rgba(0,0,0,.2)}
/* Simulated Safari Smart App Banner */
.safari{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#f2f2f7;border-bottom:1px solid #d8d8dc;font-family:-apple-system,Arial,sans-serif}
.safari .x{color:#8e8e93;font-size:16px}
.safari .ico{width:36px;height:36px;border-radius:9px;background:var(--forest);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.safari .t{flex:1;font-size:12px;line-height:15px}
.safari .t b{font-size:13px}
.safari .open{background:#007aff;color:#fff;border-radius:14px;padding:4px 14px;font-weight:700;font-size:13px}
.simnote{font-size:9px;color:#8e8e93;text-align:center;background:#f2f2f7;padding-bottom:3px}
/* Reviewer panel */
.rv-tab{position:fixed;right:0;top:auto;bottom:150px;z-index:70;writing-mode:vertical-rl;background:#2b2f2ccc;color:#fff;font-size:9px;font-weight:700;padding:8px 3px;border-radius:8px 0 0 8px;letter-spacing:.5px}
.rv{position:fixed;right:0;top:0;bottom:0;width:min(310px,88vw);background:#1e2320;color:#e8ece8;z-index:80;padding:14px;overflow:auto;font-size:12px;line-height:17px;box-shadow:-4px 0 18px rgba(0,0,0,.3)}
.rv h4{font-size:13px;margin:12px 0 6px;color:#fff}
.rv .grp{display:flex;flex-wrap:wrap;gap:5px}
.rv .grp button{border:1px solid #4a524c;border-radius:12px;padding:3px 9px;color:#e8ece8;font-size:11px}
.rv .grp button[aria-pressed=true]{background:#ffb49b;color:#10241f;border-color:#ffb49b}
.rv a{color:#ffb49b;text-decoration:underline}
.rv p{color:#b9c2bb;font-size:11px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Site chrome: top navigation (tablet/desktop), site footer ---------- */
.topnav{display:none}
.sitefoot{border-top:1px solid var(--line);background:var(--surface);padding:22px var(--page) 28px;font-size:12px;color:var(--muted)}
.sitefoot .cols{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;margin:10px 0 14px}
.sitefoot a{color:var(--ink);font-weight:600;min-height:28px;display:inline-flex;align-items:center}
/* ---------- Homepage ---------- */
.mhead{display:flex;justify-content:space-between;align-items:center;padding:10px var(--page) 0}
.hero{padding:14px var(--page) 4px}
.hero h1{font-size:32px;line-height:36px;letter-spacing:-1.3px;font-weight:700}
.hero p.lead{font-size:15px;line-height:22px;color:#3d4a44;margin:8px 0 14px}
.hero .ctas{display:flex;gap:8px}
.hero .ctas .btn+.btn{margin-top:0}
.hero .ctas .btn{width:auto;flex:1}
.hero .art{height:170px;margin:16px 0 0}
.hsec{padding:22px var(--page) 4px}
.hsec h2{font-size:20px;line-height:24px;letter-spacing:-.5px;margin:0 0 4px}
.hsec .sec-sub{font-size:12px;color:var(--muted);margin-bottom:12px}
.tiles{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 calc(var(--page)*-1);padding:0 var(--page) 6px}
.tile{flex:none;width:232px;scroll-snap-align:start;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:#fff;display:block}
.tile .tp{height:116px;background:var(--surface)}
.tile .tp img{width:100%;height:100%;object-fit:cover;display:block}
.tile .tc{padding:10px 12px 12px}
.tile h3{font-size:15px;line-height:19px;font-weight:700;letter-spacing:-.3px;margin-bottom:3px}
.steps{display:grid;gap:10px}
.stepc{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:var(--r-md);background:var(--surface)}
.stepc .n{flex:none;width:28px;height:28px;border-radius:14px;background:var(--forest);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.stepc b{display:block;font-size:14px;line-height:19px}
.stepc span{display:block;font-size:12px;line-height:18px;color:var(--muted)}
.trust{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.trust div{border:1px solid var(--line);border-radius:var(--r-md);padding:12px}
.trust b{display:flex;gap:6px;align-items:center;font-size:13px;line-height:17px;color:var(--forest);margin-bottom:4px}

 maya:{id:'maya',name:'Maya',img:'assets/maya.jpg',background:'Product designer · London for 2 years',bio:'Finding my way around London, one little restaurant at a time. I love conversations that wander, independent bookshops and sharing the last dessert.',interests:['Food discoveries','Design','Books'],langs:'English · Hindi',life:'Making London home'},

function av(p,size){size=size||28;if(!p)return'';const inner=p.img?'<img src="'+p.img+'" alt="">':'<span style="font-size:'+Math.round(size*.4)+'px">'+esc(p.name[0])+'</span>';return '<span class="av" style="width:'+size+'px;height:'+size+'px">'+inner+'</span>';}

function route(){
 const path=(location.hash.slice(1)||'/').split('?')[0];
 let m;
 if(path==='/'||path==='')return signedIn()?pRedirect('/discover'):pHome();
 if(path==='/discover')return pDiscover();
 if(path==='/meals')return pMyMeals();
 if((m=path.match(/^\/meals\/([^/]+)$/)))return pMeal(m[1]);
 if((m=path.match(/^\/meals\/([^/]+)\/apply$/)))return pApply(m[1]);
 if((m=path.match(/^\/meals\/([^/]+)\/status$/)))return pStatus(m[1]);
 if((m=path.match(/^\/profiles\/([^/]+)$/)))return pProfile(m[1]);
 if(path==='/sign-in')return pSignIn();
 if(path==='/sign-in/email')return pEmail();
 if(path==='/sign-in/code')return pCode();
 if(path==='/profile-setup')return pProfileForm('setup');
 if(path==='/profile')return pMe();
 if(path==='/profile-edit'){if(!signedIn())return pRedirect('/sign-in?next=%2Fprofile-edit');return pProfileForm('edit');}
 if(path==='/inbox')return pInbox();
 if(path==='/inbox/notifications')return pNotifications();
 if((m=path.match(/^\/chat\/(c-[^/]+)$/)))return pChat(m[1]);

 return pNotFound();
}

  case 'chip':{const name=t.dataset.name,multi=t.dataset.multi==='1';saveForm();if(multi){const arr=S.me[name];const i=arr.indexOf(v);i<0?arr.push(v):arr.splice(i,1);}else S.me[name]=v;render();break;}
  case 'mtab':S.mealsTab=v;render();break;
  case 'withdraw-ask':sheet('<h2 id="bs-t">Withdraw your request?</h2><p>Your host won’t see this request any more. You can apply again while applications are open.</p><button class="btn sec" data-act="close-sheet">Keep my request</button><button class="textact danger" data-act="withdraw" data-v="'+v+'">Withdraw request</button>');break;
  case 'withdraw':S.apps[v]='WITHDRAWN';S.sheet=null;toast('Request withdrawn');render();break;
  case 'rv':S.rv=!S.rv;renderLayer();break;
  case 'rv-set':{const k=t.dataset.k;
   if(k==='session'){S.session=v==='out'?'out':'in';S.profileComplete=v!=='incomplete';if(v==='incomplete'){S.me=Object.assign({},ME_DEFAULT,{bio:'',interests:[],life:null,adult:false});}else if(v==='in'){S.me=Object.assign({},ME_DEFAULT);}}
   else if(k==='app'){if(v==='NONE')delete S.apps[curMeal()];else{S.apps[curMeal()]=v;if(S.session==='out'){S.session='in';}}}
   else if(k==='meal'){S.mealState[curMeal()]=v;}
   else if(k==='banner'){S.banner=v==='true';}
   else S[k]=v;
   render();break;}
  case 'rv-go':S.rv=false;break;
  case 'rv-approve':{const id=Object.keys(S.apps).find(i=>S.apps[i]==='PENDING');if(id){S.apps[id]='CONFIRMED';toast('Maya approved — seat confirmed');render();}else toast('No pending request yet');break;}
  case 'rv-reset':location.hash='#/';location.reload();break;
 }
});
function askConsent(){sheet('<h2 id="bs-t">Help improve Fancy?</h2><p>With your permission we count which pages and buttons are used, so we can make finding a table easier. No ads, and we never sell your data. You can change this any time in your profile.</p><button class="btn" data-act="consent-yes">Allow analytics</button><button class="btn sec" data-act="consent-no">Not now</button>');}
function saveForm(){const f=document.getElementById('pf');if(!f)return;const n=f.querySelector('#fn'),b=f.querySelector('#bio'),ad=f.querySelector('[name=adult]');if(n)S.me.name=n.value;if(b)S.me.bio=b.value;if(ad)S.me.adult=ad.checked;}
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.id==='intro'){const id=t.form.meal.value;S.drafts[id]=t.value;const c=document.querySelector('[data-count=intro]');if(c)c.textContent=t.value.length+'/300';}
 if(t.id==='bio'){const c=document.querySelector('[data-count=bio]');if(c)c.textContent=t.value.length+'/300';}
});
document.addEventListener('submit',e=>{
 const f=e.target;const kind=f.dataset.form;if(!kind)return;e.preventDefault();
 if(kind==='email'){const v=f.querySelector('#em').value.trim();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){f.querySelector('#em').classList.add('bad');f.querySelector('#em-err').hidden=false;f.querySelector('#em').focus();return;}S.email=v;S.codeErr=false;location.hash='#/sign-in/code?next='+encodeURIComponent(f.next.value);}
 if(kind==='code'){const v=f.querySelector('#code').value.trim();if(v!=='000000'){S.codeErr=true;render();document.getElementById('code').focus();return;}
  S.codeErr=false;S.session='in';S.me.email=S.email||S.me.email;const next=f.next.value;
  if(!S.profileComplete){location.replace('#/profile-setup?next='+encodeURIComponent(next));}
  else location.replace('#'+next);
  if(!S.consentAsked&&S.profileComplete){S.consentAsked=true;setTimeout(askConsent,250);}}
 if(kind==='profile'){saveForm();const me=S.me,err={};
  if(!me.name||me.name.trim().length<2)err.name=1;if(!me.bio||me.bio.trim().length<20)err.bio=1;if(!me.langs.length)err.langs=1;if(!me.life)err.life=1;if(!me.interests.length)err.interests=1;if(f.mode.value==='setup'&&!me.adult)err.adult=1;
  S.formErr=Object.keys(err).length?err:null;
  if(S.formErr){render();const b=document.querySelector('.bad,.err');if(b)b.scrollIntoView({block:'center'});return;}
  S.profileComplete=true;toast(f.mode.value==='setup'?'Profile saved':'Profile updated');location.replace('#'+f.next.value);
  if(!S.consentAsked){S.consentAsked=true;setTimeout(askConsent,250);}}
 if(kind==='apply'){const id=f.meal.value,v=(S.drafts[id]||'').trim();if(v.length<20){S.applyErr=true;render();document.getElementById('intro').focus();return;}S.applyErr=false;S.apps[id]='PENDING';location.replace('#/meals/'+id+'/status');toast('Request sent to '+people[mealById(id).host].name);}
 if(kind==='chat'){const i=f.querySelector('#msg');const v=i.value.trim();if(!v)return;S.chat.push({from:'me',text:v});render();window.scrollTo(0,document.body.scrollHeight);const n=document.getElementById('msg');if(n)n.focus();}
});
let lastHash=location.hash;
window.addEventListener('hashchange',()=>{S.depth++;S.open=null;S.formErr=null;S.applyErr=false;S.sheet=null;render();if(!/\?/.test(location.hash)||true)window.scrollTo(0,0);lastHash=location.hash;});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(S.sheet){S.sheet=null;renderLayer();}else if(S.rv){S.rv=false;renderLayer();}}});
render();
})();
</script>
</body>
</html>
