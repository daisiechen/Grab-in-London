<!doctype html><html lang="en"><meta charset="utf-8"><title>PATCH-006 synthetic staff sign-in</title><main><h1>Synthetic admin test environment</h1><p>Local PATCH-006 fixture only. No real email, identity or MFA provider is used.</p><button id="login">Sign in as synthetic data admin</button><p id="status" role="status"></p><h2>Synthetic one-shot faults</h2><button data-fault="lost-classify">Lose next classification response</button><button data-fault="slow-classify">Delay next classification request</button><button data-fault="slow-classification-read">Delay next classification read</button><button data-fault="503">Fail next page with 503</button><button data-fault="429">Fail next page with 429</button><button data-fault="none">Clear test fault</button><p><a href="/?lang=en#quality">Open backend</a></p></main><script type="module">
const status=document.querySelector('#status'),button=document.querySelector('#login');
button.addEventListener('click',async()=>{
 button.disabled=true;status.textContent='Signing in to the isolated synthetic environment…';
 try{
  const post=async(path,body)=>{const r=await fetch('/v1/auth/email/'+path,{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({...body,clientRequestId:crypto.randomUUID()})});if(!r.ok)throw new Error('Fixture sign-in failed ('+r.status+').');return r.json();};
  const start=await post('start',{email:'admin-patch@example.invalid',client:'WEB'});
  const result=await post('verify',{challengeId:start.data.challengeId,code:'000000'});
  if(result.data.outcome!=='AUTHENTICATED')throw new Error('Fixture sign-in incomplete.');
  location.assign('/?lang=en#quality');
 }catch(error){status.textContent=error.message;button.disabled=false;}
});
document.querySelectorAll('[data-fault]').forEach(control=>control.addEventListener('click',async()=>{const r=await fetch('/__admin-test/fault/'+control.dataset.fault,{method:'POST'});status.textContent=r.ok?'Synthetic fault armed: '+control.dataset.fault:'Fault refused: '+r.status;}));
</script></html>
