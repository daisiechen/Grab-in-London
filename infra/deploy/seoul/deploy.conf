# Fancy production deploy kit: non-secret settings shared by every script.
# Sourced by lib.sh. Optional server-only overrides go in /etc/fancy/deploy.local.conf
# (same KEY=value syntax, root-owned); never put secrets in either file.
#
# Ports avoid everything already used on the Seoul server (22 sshd, the owner's proxy on
# the HTTPS port and 8388, 18741/18742, 45845, 53) and the development environment's
# 3000/5174/5175/5432. Nothing here listens on a public interface.

FANCY_REPO_URL=https://github.com/daisiechen/Grab-in-London.git
FANCY_DEFAULT_REF=main
PUBLIC_HOSTNAME=fancyabite.uk

# Service account and directories
FANCY_USER=fancy
FANCY_ROOT=/srv/fancy
FANCY_RELEASES=/srv/fancy/releases
FANCY_CURRENT=/srv/fancy/current
FANCY_STATE=/srv/fancy/state
FANCY_CACHE=/srv/fancy/cache
FANCY_KIT_DIR=/opt/fancy-deploy
FANCY_ETC=/etc/fancy
FANCY_ENV_FILE=/etc/fancy/fancy.env
FANCY_WEB_BUILD_ENV=/etc/fancy/web-build.env
FANCY_BACKUP_RECIPIENTS=/etc/fancy/backup-age-recipients.txt
FANCY_PG_CA=/etc/fancy/pg-ca.crt
FANCY_BACKUPS=/var/backups/fancy

# Runtime versions (Node is private to Fancy; the system Node 20 stays untouched)
NODE_VERSION=24.22.1
NODE_DIR=/opt/node24
PNPM_VERSION=11.25.0
PG_MAJOR=17
PG_CLUSTER=main
PG_PORT=5433
PG_DB=fancy
PG_ROLE=fancy_app

# Loopback ports
API_PORT=3100
API_CANDIDATE_PORT=3101
# Web page-head server (apps/web/server/serve.ts): HTML navigations get server-written
# title/description/canonical/OG/JSON-LD for link previews; nginx still serves static files.
WEB_PORT=3102
WEB_CANDIDATE_PORT=3103
GATEWAY_PORT=8180
TUNNEL_METRICS_PORT=20241

# Retention: must match {{BACKUP_RETENTION}} / {{LOG_RETENTION}} in docs/policies
BACKUP_RETENTION_DAYS=35
LOG_RETENTION_DAYS=30
KEEP_RELEASES=5

# Build limits (2 vCPU / 3.6 GB RAM shared with PostgreSQL and the running API)
BUILD_MEMORY_MAX=1800M
BUILD_NODE_HEAP_MB=1280
