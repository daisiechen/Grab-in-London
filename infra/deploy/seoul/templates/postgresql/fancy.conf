# Fancy production settings for PostgreSQL @@PG_MAJOR@@ (conf.d drop-in, loaded last).
# Sized for 2 vCPU / 3.6 GB RAM shared with the API, worker, nginx, cloudflared and the
# owner's other services: about 0.5 GB of shared memory, the rest left to the OS cache.

listen_addresses = '127.0.0.1'
port = @@PG_PORT@@
max_connections = 50

shared_buffers = 512MB
effective_cache_size = 1536MB
work_mem = 8MB
maintenance_work_mem = 128MB
wal_buffers = 16MB
min_wal_size = 256MB
max_wal_size = 1GB
checkpoint_completion_target = 0.9
random_page_cost = 1.1
effective_io_concurrency = 100
huge_pages = off

# TLS on loopback: the production config guard requires sslmode; the API verifies the
# server certificate against a local CA (sslmode=verify-full, sslrootcert=/etc/fancy/pg-ca.crt).
ssl = on
ssl_cert_file = '/etc/postgresql/@@PG_MAJOR@@/@@PG_CLUSTER@@/fancy-tls/server.crt'
ssl_key_file = '/etc/postgresql/@@PG_MAJOR@@/@@PG_CLUSTER@@/fancy-tls/server.key'
ssl_min_protocol_version = 'TLSv1.2'
password_encryption = scram-sha-256

idle_in_transaction_session_timeout = '60s'
timezone = 'UTC'
log_timezone = 'UTC'

# Logs: weekday ring buffer (7 days max), no bind parameters (they can hold personal data).
logging_collector = on
log_directory = '/var/log/postgresql/fancy'
log_filename = 'postgresql-%a.log'
log_truncate_on_rotation = on
log_rotation_age = 1d
log_rotation_size = 0
log_line_prefix = '%m [%p] %q%u@%d '
log_min_duration_statement = 2000
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
log_checkpoints = on
log_lock_waits = on
