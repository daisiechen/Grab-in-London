# Included by every static location (nginx drops server-level add_header in locations
# that declare their own). A Content-Security-Policy is deliberately not set yet: the Web
# map loads Google Maps JavaScript; add one only after testing it against the real page.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
