# Included by the locations that hand an HTML navigation to the Web page-head server
# (fancy-web, apps/web/server/serve.ts on 127.0.0.1:@@WEB_PORT@@). It writes the page head
# and its own Cache-Control; its security headers are replaced by the gateway's set.
proxy_pass http://127.0.0.1:@@WEB_PORT@@;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $fancy_client_ip;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header Connection "";
proxy_connect_timeout 2s;
proxy_read_timeout 15s;
proxy_send_timeout 15s;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header Permissions-Policy;
include snippets/fancy-security-headers.conf;
# fancy-web down or not answering: serve the plain single-page app (no per-page head).
error_page 502 504 = @spa;
