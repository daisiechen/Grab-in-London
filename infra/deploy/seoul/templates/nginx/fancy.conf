# Fancy same-origin gateway. Loopback only: the sole client is cloudflared (Cloudflare Tunnel).
# Serves the Web app's static files, /admin/ and the legal pages, proxies /v1 to the API and
# hands HTML navigations to the Web page-head server (fancy-web), all on
# https://@@PUBLIC_HOSTNAME@@ so the __Host- session cookie and CSRF Origin checks work.
# This server never listens on a public interface.

# Real client address: Cloudflare sets CF-Connecting-IP; cloudflared passes it through.
# It is written as the single X-Forwarded-For value, and the API trusts only 127.0.0.1
# (TRUSTED_PROXY_CIDRS), so a client-supplied X-Forwarded-For is always discarded.
map $http_cf_connecting_ip $fancy_client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

# Privacy: path only (no query strings, which can carry search terms or tokens).
log_format fancy_privacy '$fancy_client_ip [$time_iso8601] "$request_method $uri $server_protocol" '
                         '$status $body_bytes_sent $request_time "$http_user_agent"';

server {
    listen 127.0.0.1:@@GATEWAY_PORT@@ default_server;
    server_name @@PUBLIC_HOSTNAME@@;
    server_tokens off;
    # Redirects stay relative ("Location: /admin/"): behind the tunnel nginx would otherwise
    # build http://<host>:@@GATEWAY_PORT@@/... from its own loopback listener.
    absolute_redirect off;

    access_log /var/log/fancy/nginx-access.log fancy_privacy;
    error_log  /var/log/fancy/nginx-error.log warn;

    # Web app + legal pages at the root, admin console under /admin/ (assembled by release.sh).
    root @@FANCY_CURRENT@@/site;
    index index.html;

    # Avatar uploads are base64 JSON (<= 2 MiB decoded); the API enforces exact limits.
    client_max_body_size 4m;

    if ($host = www.@@PUBLIC_HOSTNAME@@) {
        return 301 https://@@PUBLIC_HOSTNAME@@$request_uri;
    }

    location /v1/ {
        proxy_pass http://127.0.0.1:@@API_PORT@@;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $fancy_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Readiness for external uptime monitors: returns only a status word.
    location = /healthz {
        proxy_pass http://127.0.0.1:@@API_PORT@@/health/ready;
        proxy_set_header Host $host;
        access_log off;
    }

    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        include snippets/fancy-security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri /admin/index.html;
    }

    location /admin/assets/ {
        include snippets/fancy-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /assets/ {
        include snippets/fancy-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Source maps stay out of production responses (release.sh also deletes them).
    # A regex location outranks the plain prefix locations above.
    location ~ \.map$ {
        return 404;
    }

    # HTML navigations go to the Web page-head server (fancy-web, apps/web/server/serve.ts),
    # which writes each public page's title/description/canonical/OG/JSON-LD for link-preview
    # bots, answers 301 to canonical meal addresses and generates robots.txt and sitemap.xml.
    # Files that exist in the build (images, favicon, legal CSS) and the legal pages, which are
    # directories with index.html (/privacy -> /privacy/index.html), are served directly.
    location / {
        include snippets/fancy-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html @web;
    }

    # "/" itself would match the static /index.html above; the home page needs its head too.
    location = / {
        include snippets/fancy-web-proxy.conf;
    }

    # The SPA shell is only reachable through fancy-web, so its head is never skipped.
    location = /index.html {
        return 301 /;
    }

    location @web {
        include snippets/fancy-web-proxy.conf;
    }

    # Fallback while fancy-web is down: the plain single-page app (title from the build).
    location @spa {
        include snippets/fancy-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }
}
